# The rank of a monster's abilities (task 3.4 of add-level-rework, M4), read statically on 2026-10-01. ability_power
# and creature_attack_speed hold the same rule: a creature whose skill level for the ability's track is 0 and whose
# hostile_type is not 0 (not the player) gets rank = floor(level / 2) + power_base + 1, the level halved by integer
# arithmetic (cdq, sub, sar). Both copies load the level (+0x190) and power_base (+0x1A8) into EAX and ECX just before.
# The image holds no other copy of the rule: the only loads of power_base (+0x1A8) followed by a halving are these two.

[[function]]
name = "ability_power_rank_site"
address = 0x43F643
convention = "cdecl"
kind = "site"
subsystem = "combat"
status = "verified"
evidence = ["xref:ability_power", "manual:EAX = level, ECX = power_base here; cdq, sub, sar, inc, add follow", "probe:rank-and-equip-gate", "probe:ability-rank-replacement"]
source = "kyubu"
notes = "the monster rule of ability_power, after both loads: EAX = level, ECX = power_base. A mid hook writes EAX = floor(old(N)); the displaced instructions halve it and add power_base + 1. The 8 displaced bytes end at 0x43F64B, so no jump enters them. Reached only for hostile_type != 0 and skill level 0"

[[function]]
