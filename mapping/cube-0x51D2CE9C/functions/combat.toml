# Hits and damage (task 9.5). A hit is a cube::Hit record (cuwo's hit packet: attacker and target ids, damage, stun
# and slow times, position, direction, hit type). The side that runs the attacker's mode detects it: the melee case
# and the other dispatch blocks compute the damage and call hitCreature, which records the hit in the step's output
# (sent to the server by a joined client) and applies it with applyHit unless the World is a joined client's.
# The server's World step also applies the hits its clients sent (cube::World::update's third argument; Cube.exe
# passes none). A joined client applies the hits the server forwards to its player in cube::GameController::update.

