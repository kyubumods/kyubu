source = "kyubu"
notes = "after the player's bit 0x40 (full speed) and bit 4 (lock-on) are settled for the frame. EDI is the game controller, the player is [EDI+0x8006C8]. Setting bit 0x40 here gives the next World steps the doubled walk cap"

