# The input-to-ability-start path (task 9.1). cube::GameController::update walks the player's ability table (a
# std::vector<int> at GameController+0x80080C, one id per slot) each frame. Slot 0 is the primary attack
# (cube::Creature::primaryAttack); for a pressed slot 1 or higher it asks modeInterruptible and canUseAbility, then
# switches on the id and writes it to current_mode (abilityStartSite for most ids).

[[function]]
name = "cube::GameController::abilityStartSite"
address = 0x49BF68
convention = "cdecl"
kind = "site"
subsystem = "combat"
status = "verified"
evidence = ["xref:cube::GameController::update", "manual:the ability switch's shared tail: mode time = 0", "probe:ability-start"]
source = "kyubu"
notes = "current_mode was just set to the pressed slot's ability id (the default case and ids 5, 10, 11, 17, 20); the next instructions clear the mode time (+0x6C) and +0x128. EDI is the game controller, [esp+0x48] the player"

# The player's walk speed while an ability runs (add-skills-unleashed, probe ability-walk-speed, runs 12 to 18). After the
# input each frame, cube::GameController::update sets bit 0x40 of data.flags (Creature+0x124, "full speed") when
# GameController+0x14 is 0 (0x498500). Then it sets bit 4 (lock-on) and clears bit 0x40 for the whole of a hold mode and
# for the first modeDuration + 200 ms of most others (the lists are in mapping/atlas/combat.md, "Walk speed"). cube::World::update caps the walk at a
# rate that starts at 6.0 and is doubled while bit 0x40 is set (0x618653), so an ability halves the walk's cap (a mod ability's
# walk peaked 0.72 times lower). Setting the bit back at walkLockEndSite, in mode 112, gave 9.55 blocks/s against 9.85 on foot
# and 7.11 without.

[[function]]
name = "cube::GameController::walkLockSite"
address = 0x4985D2
convention = "cdecl"
kind = "site"
subsystem = "combat"
status = "verified"
evidence = ["xref:cube::GameController::update", "manual:setFlag(player data, 0x40, 0) follows", "probe:ability-walk-speed"]
source = "kyubu"
notes = "only on the mode rule's path: bit 0x40 of the player's data.flags (Creature+0x124) is cleared next, and still holds what the input gave it; bit 4 (lock-on) was just set unless the mode is 0x57 to 0x59 or 0x5C. EDI is the game controller, the player [EDI+0x8006C8]"

[[function]]
name = "cube::GameController::walkLockEndSite"
address = 0x4985E4
convention = "cdecl"
kind = "site"
subsystem = "combat"
status = "verified"
