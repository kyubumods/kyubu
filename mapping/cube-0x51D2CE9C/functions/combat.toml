# Costs and limits (task 9.4), all inside cube::World::update. A mode's fixed cost (ability_cost, non-zero only for
# 3, 4, 31, 33, 34, 37, 43, 45, 46 and 95) is taken from mp on the mode's first step; the hold modes (8, 24, 25, 27,
# 36, 59, 63, 64) instead build up charged_mp while held, and the melee case spends it (mp -= charged_mp) on the next
# step. The step also stores each new mode's cooldown in the creature's map and counts every cooldown down.

