# Cube.exe: keyboard and mouse. WinMain polls DirectInput 8 (a keyboard and a mouse device) and forwards the window
# messages; cube::Controller keeps the key and button state, and cube::GameController overrides its handlers.
# Server.exe has no input.

[[function]]
name = "cube::Controller::Controller"
address = 0x43BD60
convention = "thiscall"
subsystem = "input"
status = "candidate"
evidence = ["rtti:cube::Controller", "xref:cube::GameController::GameController"]
source = "kyubu"
notes = "stores the vtable and clears the key and button arrays (memset); the game controller's base"

