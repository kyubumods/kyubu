# Where an item's level comes from (task 6.1 of add-level-rework, M8), read statically on 2026-10-03.
# Every generated item gets its level word (+0x10) from one of the two twin generators, called with (out, level, rarity,
# category). A kill's gear drop, the loot a spawn carries and the zone-completion bonus item pass a creature level, a mod
# level after 5.2, straight in: level_rework stores item_stored_level(N) = 2000 + N there (6.6). The store (0x5C8570) builds its stock from
# level_from_power_fraction(i/30) and is already item scale. The call at 0x47CFA9 (onMouseDown) reads a stored level.

[[function]]
name = "item_generate"
address = 0x5F74E0
convention = "thiscall"
prototype = "cube::ItemData* __thiscall item_generate(void* this, cube::ItemData* out, int16_t level, uint8_t rarity, int32_t category)"
subsystem = "items"
status = "candidate"
evidence = ["manual:four stack arguments, level stored at ItemData+0x10", "xref:item_generate_alt"]
source = "kyubu"
notes = "makes one random item of the category (-1: any; callers also pass the creature's class byte). The level (2nd stack argument): level_rework stores 2000 + N. Twin of item_generate_alt: callers pick one by a coin flip. Callers 0x47CFA9, 0x5952A6, 0x599CF9, 0x5C88AB, 0x5D827A, 0x5F57F0"

