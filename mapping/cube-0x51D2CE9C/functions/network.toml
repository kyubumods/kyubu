# The creature update (packet 0) writer and reader (read statically on 2026-09-30).

[[function]]
name = "creature_update_write"
address = 0x4CD840
convention = "cdecl"
prototype = "void __cdecl creature_update_write(void* buffer, cube::CreatureData* last_sent, cube::CreatureData* now, bool full)"
subsystem = "network"
status = "candidate"
evidence = ["xref:client_send_loop", "cuwo:cuwo/entity.pyx"]
source = "kyubu"
notes = "compares every CreatureData field with the last sent copy (all when full) and writes a u64 mask followed by the changed fields, in cuwo's order. The spare fields (not_used_1-6, not_used7/8, unknown_or_not_used1/2/4, not_used19/20) are compared and sent too"

[[function]]
name = "creature_update_read"
address = 0x4CCD40
convention = "cdecl"
prototype = "int32_t __cdecl creature_update_read(void* buffer, cube::CreatureData* data)"
subsystem = "network"
status = "candidate"
evidence = ["cuwo:cuwo/entity.pyx", "manual:reads a u64 mask, then each masked field into data"]
source = "kyubu"
notes = "the buffer reader of the masked creature data (0x4CD180 reads the same format from the socket)"
