# Cube.exe: multiplayer client.

[[function]]
name = "Net::connectPortSite"
address = 0x46FF38
convention = "cdecl"
kind = "site"
sig_len = 10
subsystem = "network"
status = "verified"
evidence = ["import:ws2_32.dll!htons", "manual:push 0x3039 (port 12345) as the argument of htons"]
source = "kyubu"

# Task 6.6: the client side of the protocol. The socket is at GameController+0x8006C4.

[[function]]
name = "client_connect"
address = 0x46FE90
convention = "thiscall"
subsystem = "network"
status = "candidate"
evidence = ["import:ws2_32.dll!connect", "string:\"Error: Server is full.\""]
source = "kyubu"
notes = "on the game controller, (host): socket, connect to port 12345 (Net::connectPortSite is inside), send id 0x11 and the client version (Net::connectVersionSite), then switch on a u32 reply: 16 join, 18 full, 17 version mismatch, else Connection error. A vanilla Server.exe never sends 17"

[[function]]
name = "Net::connectVersionSite"
address = 0x470159
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:client_connect", "manual:the client version is stored here, then sent", "probe:protocol-version"]
source = "kyubu"
notes = "in client_connect: the store of the client version (a vanilla server accepts only 3). The immediate is at +6 (0x47015F): level_rework patches it (mod symbol level_rework:protocol_version_send), so a probe must not hook it. The error text shows the client version from a constant, not this value"

[[function]]
name = "Net::connectJoinSite"
address = 0x470286
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:client_connect", "manual:the join reply (16) branch", "probe:protocol-version"]
source = "kyubu"
notes = "observation point, 6 bytes (lea esi,[ebx+0x2DC]): reached once per join, never on a refusal"

[[function]]
name = "Net::connectMismatchSite"
address = 0x4709AA
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:client_connect", "manual:the version mismatch reply (17) branch", "probe:protocol-version"]
source = "kyubu"
notes = "observation point, 6 bytes: reads the server's version, then shows the version error. A vanilla Server.exe never sends 17, so a refusal by one does not reach it (see Net::connectUnknownReplySite)"

[[function]]
name = "Net::connectUnknownReplySite"
address = 0x4701FD
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:client_connect", "manual:the default of client_connect's reply switch: the Connection error text", "probe:protocol-version"]
source = "kyubu"
notes = "observation point, 5 bytes (push imm32): any reply other than 16, 17 and 18 shows 'Connection error' and closes the socket. A vanilla Server.exe answers a client with a version other than 3 with a bare 3, which lands here"

[[function]]
