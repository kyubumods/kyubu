# The per-world position map and the character list (read statically in task 7.1 of add-level-rework, 2026-10-04).

[[function]]
name = "character_world_map_index"
address = 0x44B9F0
convention = "thiscall"
prototype = "void* __thiscall character_world_map_index(void* this, void* key)"
subsystem = "saves"
status = "candidate"
evidence = ["probe:character-slot-load", "probe:character-marker", "xref:character_deserialize", "xref:save_character", "manual:ret 4; a find-or-insert on the std::map, the lookup is 0x44BE10"]
source = "kyubu"
notes = "operator[] of the per-world position map (this = (Creature+0x1D28)+0x1C). Key: u32 seed, std::string at +4 (an inline 12-char key works). Node: key +0x10, 24-byte value +0x30. Inserts a zeroed value. Callers: character_deserialize, save_character, 0x46BA2F"

[[function]]
