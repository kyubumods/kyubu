[[function]]
name = "load_character"
address = 0x480B80
convention = "thiscall"
prototype = "void __thiscall load_character(cube::GameController* this, int32_t slot, cube::Creature* creature)"
subsystem = "saves"
status = "verified"
evidence = ["probe:character-slot-load", "probe:character-level-clamp", "probe:character-slot-played-0", "probe:character-slot-played-1", "xref:cube::Database::getBuffer", "manual:reads a characters.db slot, decompresses it, deserializes it", "manual:ret 8; three callers, read in 7.1"]
source = "kyubu"
notes = "reads characters.db under the world lock, decompresses and fills the creature through character_deserialize. No row: returns, creature untouched. Also fills the list creatures; the player is the one equal to the controller +0x8006C8. Callers: constructor, onMouseUp, select click"

[[function]]
name = "character_deserialize"
address = 0x44C3C0
convention = "thiscall"
subsystem = "saves"
status = "candidate"
evidence = ["probe:character-slot-load", "xref:load_character", "manual:reads the character_serialize format back into a creature"]
source = "kyubu"
notes = "every per-world position map entry is inserted as read (key = world seed and name), with no filter or cap, by character_world_map_index (call at 0x44CEC5, returns to 0x44CECA); zone_loader_step later looks up only the exact key of the world being entered. The map is the one at (Creature+0x1D28)+0x1C"

[[function]]
name = "delete_character"
