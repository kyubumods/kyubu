# The skill tree's point budget and the respec cost (task 3.5 of add-level-rework, M10), read statically on 2026-10-01.
# No unspent-points counter is stored: the budget is computed from the level wherever it is needed. creature_level_up
# writes only the level, the XP and +0x16C, so a level-up grants nothing. The ranks live in Creature+0x1138 (11 values);
# the open skill panel edits a working copy at SkillWidget+0x160 (GameController+0x800904), copied from the creature when
# the panel opens (toggleSkills) and written back by the skill-panel part of the click handler (0x47CD36 to 0x47CDB1), which
# asks respecCost for a price, takes it from Creature+0x1304 and copies the ranks and the specialization byte (+0x141).
# The panel opens with the key X (VK 0x58, onKeyDown 0x47ECEF) or the HUD button 3 (0x47BD35).
# Two places compute the budget: the click that adds a rank, 2 * level - 2 + mana_cubes / 4 (rounding toward zero), and the
# Points: text, 2 * level - 2 with no mana-cube term.

[[function]]
name = "cube::GameController::toggleSkills"
address = 0x488EC0
convention = "thiscall"
subsystem = "ui"
status = "candidate"
evidence = ["manual:flips +0x8008E9; on opening copies the ranks to the widget", "probe:skill-points"]
source = "kyubu"
