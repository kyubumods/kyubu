# The terrain's block at a point (read statically on 2026-10-18, task 9.2a of add-skills-unleashed: the Scout's trap needs the
# ground under a point). The projectile update asks it whether a projectile is inside a solid block (cube::World::projectileSurfaceSite).

[[function]]
name = "cube::World::getBlock"
address = 0x430040
convention = "thiscall"
prototype = "const uint8_t* __thiscall cube::World::getBlock(cube::World* this, int64_t x, int64_t y, int64_t z, int32_t flag)"
subsystem = "world"
status = "candidate"
evidence = ["xref:cube::World::projectileSurfaceSite", "manual:called with the projectile's x, y, z and 0 at 0x62091D"]
source = "kyubu"
notes = "the block at a point (world units, floored to blocks); flag 0. Never NULL: an unloaded place gives a static default block. Byte +3 & 0x1F is the kind; 0x43BD20 calls a block solid unless the kind is 0 (air) or 2 (water, a guess). No lock: call it in the World step"

# The client's region generator (read statically on 2026-10-03, task 5.2 of add-level-rework; the Server.exe twin is region_generate 0x50DE10).

[[function]]
name = "region_generate"
address = 0x5D8CD0
convention = "thiscall"
prototype = "void __thiscall region_generate(cube::World* this, int32_t grid_row, int32_t grid_column)"
subsystem = "world"
status = "candidate"
evidence = ["correlated:server-0x51D2CE9B:region_generate", "xref:cube::World::generateZone", "probe:region-area-levels"]
source = "kyubu"
notes = "ret 8; slot World+0xBC + 4*(row*1024 + column). A counter i runs 0-63 and only EVEN i give a mission an area level (at most 32; i/64 into level_from_power_fraction, 1 to 621); (i>>1) odd means a dungeon. The 2026-09-30 note (64 ranks, odd ranks dungeons) was wrong"

