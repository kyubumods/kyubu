notes = "the combat AI, 8846 bytes. The target is the id topThreat returns, looked up in the World and kept while it exists. With none it scans for the nearest enemy in range and gives it threat 1.0. While the target is far or unseen its threat falls 0.9 a step; after 20 s the AI gives up"

[[function]]
name = "cube::CombatBehavior::targetScanSite"
address = 0x42D0EE
convention = "cdecl"
kind = "site"
subsystem = "ai"
status = "candidate"
evidence = ["xref:cube::CombatBehavior::update", "manual:the first-target scan's range test of each candidate", "correlated:cube-0x51D2CE9C:cube::CombatBehavior::targetScanSite"]
source = "kyubu"
notes = "once per candidate in the scan for a first target: EBX the candidate, XMM2 its squared distance (already divided by the stealth factor), XMM4 the squared radius. XMM4 <= XMM2 skips it, so a huge XMM2 written here keeps that creature out of the scan (the ninja's true stealth). safesites.py: ok"

[[function]]
name = "cube::Creature::topThreat"
address = 0x444BF0
convention = "thiscall"
prototype = "uint64_t __thiscall cube::Creature::topThreat(cube::Creature* this)"
subsystem = "ai"
status = "verified"
evidence = ["xref:cube::CombatBehavior::update", "manual:walks Creature+0x13A4, returns the key of the largest value", "correlated:cube-0x51D2CE9C:cube::Creature::topThreat"]
source = "kyubu"
notes = "the id of the creature holding the most threat (a tie goes to the later key), 0 when the map is empty. The combat AI looks it up in the World and attacks it, so a large value written for an id sets the target"

