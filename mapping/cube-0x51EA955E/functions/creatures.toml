# Cube.exe: creatures and their appearance.

# Task 8.4: how a creature's appearance and equipment become the models it is drawn with.

[[function]]
name = "draw_creature"
address = 0x4128F0
convention = "thiscall"
prototype = "void __thiscall draw_creature(void* this, void* arg1, void* arg2, void* arg3, ModelLoader* models, uint32_t frame_ms, void* arg6, void* arg7, void* arg8, uint32_t hide_mask, void* arg10)"
subsystem = "creatures"
status = "verified"
evidence = ["xref:cube::GameController::render", "manual:reads appearance *_model ids at Creature+0x8C..+0x9A as model slots", "manual:ten stack arguments, ret 0x28 at 0x423D46", "correlated:cube-0x51D2CE9C:draw_creature"]
source = "kyubu"
notes = "this: the draw record, inside the creature at Creature + 0x1498 (+0 creature, +4 mode time, +8 pose id: atlas); arg 4 the ModelLoader, arg 5 the frame ms (0 in trail calls), arg 9 hides parts. Picks each part from the equipped item or the appearance id (bounds-checked), then poses and draws it."

