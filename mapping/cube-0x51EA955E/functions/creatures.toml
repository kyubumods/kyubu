# Read statically on 2026-10-19 (add-skills-unleashed, the Ninja's true stealth): a monster's threat map (Creature +0x13A4)
# has the same node layout as the World's creature map, so this erase removes one entry from it as well.

[[function]]
name = "creature_map_erase"
address = 0x43EDE0
convention = "thiscall"
prototype = "void* __thiscall creature_map_erase(std::map* this, void** out_next, void* node)"
subsystem = "creatures"
status = "candidate"
evidence = ["xref:cube::World::creatureDespawnSite", "manual:std::map erase(iterator) of the World's map, ret 8; 16 callers", "correlated:cube-0x51D2CE9C:creature_map_erase"]
source = "kyubu"
notes = "erases one node of a map with 8-byte keys and a 4-byte value (World+4, or a creature's threat map +0x13A4): rebalances, frees the node, lowers the size at this+4, stores the next node in *out_next. World::update's despawn and death paths use it. The node must belong to this map"

