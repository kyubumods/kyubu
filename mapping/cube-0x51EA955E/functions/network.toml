source = "kyubu"
notes = "the buffer reader of the masked creature data (0x4CD3E0 reads the same format from the socket)"

# Task 10.4 of add-skills-unleashed-multiplayer (design D10): where the loader reads and writes Kyubu packets on a joined game.

[[function]]
name = "Net::clientReceiveNextSite"
address = 0x46D0DD
convention = "cdecl"
kind = "site"
sig_len = 6
subsystem = "network"
status = "verified"
evidence = ["probe:channel-transport-client", "xref:client_receive_loop", "manual:switch default (ids above 15, 6-9, 11-14) and every case end"]
