notes = "after each packet, at the loop test (6 bytes: loads the disconnected byte at [EBP-0x11D1]). [EBP-0x1220] the u32 packet id just read, [EBX] the cube::GameController. An unknown id reads nothing more: the loader reads its own packet here"

[[function]]
name = "Net::clientSendPassSite"
