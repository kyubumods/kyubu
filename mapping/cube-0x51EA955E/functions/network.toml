# Task 6.6: the client side of the protocol. The socket is at GameController+0x8006D4.

[[function]]
name = "client_connect"
address = 0x46FC50
convention = "thiscall"
subsystem = "network"
status = "candidate"
evidence = ["import:ws2_32.dll!connect", "string:\"Error: Server is full.\"", "correlated:cube-0x51D2CE9C:client_connect"]
source = "kyubu"
notes = "on the game controller, (host): socket, connect to port 12345 (Net::connectPortSite is inside), send id 0x11 and the client version (Net::connectVersionSite), then switch on a u32 reply: 16 join, 18 full, 17 version mismatch, else Connection error. A vanilla Server.exe never sends 17"

[[function]]
name = "Net::connectVersionSite"
address = 0x46FF19
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:client_connect", "manual:the client version is stored here, then sent", "correlated:cube-0x51D2CE9C:Net::connectVersionSite"]
source = "kyubu"
notes = "in client_connect: the store of the client version (a vanilla server accepts only 3). The immediate is at +6 (0x46FF1F): level_rework patches it (mod symbol level_rework:protocol_version_send), so a probe must not hook it. The error text shows the client version from a constant, not this value"

