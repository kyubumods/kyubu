[[function]]
name = "character_select_click"
address = 0x483E70
convention = "thiscall"
prototype = "void __thiscall character_select_click(cube::GameController* this)"
subsystem = "saves"
status = "candidate"
evidence = ["manual:ret, no stack arguments; registered as a callback at 0x4656A6", "manual:calls load_character(selected slot, player)", "correlated:cube-0x51D2CE9C:character_select_click", "manual:placed in 07-20 by aligned instructions; the code nearby changed"]
