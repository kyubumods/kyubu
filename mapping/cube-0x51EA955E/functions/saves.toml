convention = "fastcall"
subsystem = "saves"
status = "candidate"
evidence = ["xref:save_character", "manual:replaces the buffer with its compressed copy (0x5FC0D0)", "correlated:cube-0x51D2CE9C:save_buffer_compress", "manual:placed in 07-20 by aligned instructions; the code nearby changed"]
source = "kyubu"
