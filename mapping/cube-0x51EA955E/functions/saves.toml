[[function]]
name = "load_character"
address = 0x4806C0
convention = "thiscall"
prototype = "void __thiscall load_character(cube::GameController* this, int32_t slot, cube::Creature* creature)"
subsystem = "saves"
status = "verified"
evidence = ["xref:cube::Database::getBuffer", "manual:reads a characters.db slot, decompresses it, deserializes it", "manual:ret 8; three callers, read in 7.1", "correlated:cube-0x51D2CE9C:load_character"]
source = "kyubu"
notes = "reads characters.db under the world lock, decompresses and fills the creature through character_deserialize. No row: returns, creature untouched. Also fills the list creatures; the player is the one equal to the controller +0x8006D8. Callers: constructor, onMouseUp, select click"

[[function]]
name = "character_deserialize"
address = 0x44BE40
convention = "thiscall"
subsystem = "saves"
status = "candidate"
evidence = ["xref:load_character", "manual:reads the character_serialize format back into a creature", "correlated:cube-0x51D2CE9C:character_deserialize"]
source = "kyubu"
notes = "every per-world position map entry is inserted as read (key = world seed and name), with no filter or cap, by character_world_map_index (call at 0x44C945, returns to 0x44C94A); zone_loader_step later looks up only the exact key of the world being entered. The map is the one at (Creature+0x1D28)+0x1C"

[[function]]
name = "delete_character"
address = 0x4816F0
convention = "fastcall"
subsystem = "saves"
status = "candidate"
evidence = ["xref:cube::Database::setBuffer", "manual:rewrites num, deletes the slot's key, renames each later key down", "correlated:cube-0x51D2CE9C:delete_character"]
source = "kyubu"
notes = "the selected slot is GameController+0x800A0C (selected_character). Later blobs are moved to the key one lower as they are, without re-serializing them; then the character list widgets are rebuilt (0x49D650)"

[[function]]
name = "create_character"
