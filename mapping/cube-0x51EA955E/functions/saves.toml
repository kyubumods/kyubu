# The character save (Save/characters.db) and the zone save format (read statically on 2026-09-30; the blob
# layout was checked byte for byte against a real save, see the saves atlas page).

[[function]]
name = "save_character"
address = 0x487520
convention = "thiscall"
prototype = "void __thiscall save_character(cube::GameController* this, int32_t slot, cube::Creature* player)"
subsystem = "saves"
status = "verified"
evidence = ["xref:cube::Database::setBuffer", "manual:writes characters.db (GameController+0x1001010) under the slot", "correlated:cube-0x51D2CE9C:save_character"]
source = "kyubu"
notes = "stores the player's position in the world's entry of the position map, copies the player into a temporary creature under the World's lock, serializes, compresses and stores it under the decimal slot number. The 60 s autosave runs it on a worker thread: a Lua detour froze the game (saves atlas)"

[[function]]
name = "cube::GameController::saveCopiedSite"
address = 0x4876C8
convention = "cdecl"
kind = "site"
sig_len = 12
subsystem = "saves"
status = "candidate"
evidence = ["xref:save_character", "manual:after the World's unlock, before character_serialize", "correlated:cube-0x51D2CE9C:cube::GameController::saveCopiedSite"]
source = "kyubu"
notes = "in save_character, between the copy and its serialization: EBX is the temporary cube::Creature that will be written (a change of it is saved and never seen in the game), [EBP+0xC] the player it was copied from and [EBP+8] the slot. The World's lock is released here"

[[function]]
name = "character_serialize"
address = 0x44D790
convention = "thiscall"
prototype = "void __thiscall character_serialize(void* writer, cube::Creature* creature)"
subsystem = "saves"
status = "candidate"
evidence = ["xref:save_character", "manual:writes a fixed list of fields; parsed a real 64,595-byte blob with it", "correlated:cube-0x51D2CE9C:character_serialize"]
source = "kyubu"
notes = "format 1: version, pos, body angles, hp, xp, level, class, specialization, Creature+0x1198/+0x119C, 13 equipment items, name, 20 style bytes, inventory tabs, +0x1304/+0x1308, known formulas, per-world position map, last world, mana cubes, 11 skills. No other CreatureData field"

[[function]]
name = "save_writer_init"
address = 0x44A8A0
convention = "thiscall"
subsystem = "saves"
status = "candidate"
evidence = ["xref:save_character", "manual:stores the output buffer and the format version 1", "correlated:cube-0x51D2CE9C:save_writer_init"]
source = "kyubu"
notes = "the writer passed to character_serialize and zone_serialize: +0 the byte buffer, +4 the version written first (1), +8 zero"

[[function]]
