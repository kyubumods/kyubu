# Recorded with kyubu_probe, mods-dev/slot4_proto (full trust) and the Kyubu 1.0.1 loader, unattended under Wine 9.0
# (task 2.7 of add-ability-api): what ends or holds a mode besides time: the stun, the Creature+0x130 timer and a dodge
# roll. P below is the player's cube::Creature, [[@0x7691C8] + 0x8006C8]; its current_mode is the byte at +0x68, mode
# time the dword at +0x6C, data.stun_time the dword at +0x12C, data.slowed_time the dword at +0x130 (the timer that
# World::update counts down at 0x610654), data.roll_time the dword at +0x128 and stamina the float at +0x1194.
# The roll needs the middle button (GameController+0xA) and W (+0xB) together: `hold w+mouse2` presses both.
id = "ability-interrupts"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-05"
steps = [
    "Wine replay: gamepilot made the level-1 warrior Tester and a new world; slot4_proto pushed 115 as slot 4",
    "Phase 1: field finder on the player's i32 fields, stun_time written 4000 (a sanity check of the finder)",
    "Phase 2: forced mode 57, then data.slowed_time 4000 (the +0x130 timer), with 0x610654 and 0x61066A traced",
    "Phase 3: forced mode 115 (not in modeDuration's switch), then data.slowed_time 4000",
    "Phase 4: forced mode 115, then the middle mouse button held 0.6 s alone: GameController+0xA, and the roll block's gates",
    "Phase 4b: forced mode 115, then W alone; then W and the middle button together (the dodge roll); then the same chord with mode 0",
    "Phase 5: a hostile level-50 creature next to the player forced into each mode in turn (all but 0, 49, 92, 105): which hits stun the player?",
]
observations = [
    "Wine replay 10 passed, 22 of 22 checks held (replays 1 to 9 were development runs; the reports of 2, 5, 9 and 10 are in the evidence folder; replays 7 and 8 died when another session's replay used the same Wine prefix)",
    "phase 1: the finder lists +0x12C among the increases after stun_time was written 4000 (a sanity check, not the natural stun)",
    "phase 2 and 3: data.slowed_time 4000 was 3483 after 0.5 s and 0 after 5.5 s, a countdown in ms clamped to 0 (World::update 0x610654, 5100 calls, every creature)",
    "phase 2 and 3: while it was above 0 the branch at 0x61066A ran (216 calls, modeDuration + 1 stored in the mode time), but modes 57 and 115 were still running at 5.5 s and the mode time kept counting (1383, then 2918)",
    "phase 4: the middle mouse button alone moved the byte GameController+0xA (kb: 2 changes) but the roll block 0x4A70CA was not entered: GameController+0xB (W) read 0",
    "phase 4b: W alone with 115 running: mode stayed 115, roll_time unchanged. W and the middle button together (hold w+mouse2 0.6): current_mode went 115 -> 0, roll_time changed 7 times (600 ms counting down to 0), stamina fell from 1 to 0.837 (the 0.25 drop, then the refill); the store at 0x4A723F ran once",
    "phase 4b control: the same chord with mode 0 and roll_time 0 rolled too (roll_time changed 6 times); 0x4A723F ran 2 times in all",
    "phase 5: a hostile level-50 creature forced into mode 54 (SMASH) raised the player's stun_time from below 0 to about +1150 within 0.7 s (about 2000 ms at the hit) in 4 of 4 sweeps; modes 9 and 74 in 3 of 4, 20 and 88 once each; the other modes (all but 0, 49, 92, 105) not in replay 2",
    "phase 5: the stun is the same World::update 0x616DBD stun that cleared mode 115 in probe ability-mode-end"
]

[[confirms]]
entry = "cube::CreatureData.stun_time"
observed = "raised from below 0 to about +1200 within 0.7 s by a hostile creature's mode 54 (SMASH) in 4 of 4 sweeps; modes 9 and 74 in 3 of 4, 20 and 88 once each"

[[confirms]]
entry = "cube::CreatureData.slowed_time"
observed = "the timer at Creature+0x130, in ms: written 4000, it was 3483 after 0.5 s and 0 after 5.5 s; World::update 0x610654 counts it down"

[[confirms]]
entry = "cube::CreatureData.roll_time"
observed = "set to 600 ms by a dodge roll (W and the middle button held): the store at 0x4A723F ran once for each chord"

[[confirms]]
entry = "cube::CreatureData.current_mode"
observed = "a dodge roll writes 0 to it while mode 115 runs (the store at 0x4A7251)"

[[confirms]]
entry = "cube::Creature.stamina"
observed = "a dodge roll takes 0.25 of it"

[replay]
host = "Cube.exe"
setup = "new-world"
seconds = 420
mods = ["mods-dev/slot4_proto"]
input = [
    "until interrupts keymap mouse2",
    "hold mouse2 0.6",
    "until interrupts roll w",
    "hold w 0.6",
    "until interrupts roll chord",
    "hold w+mouse2 0.6",
    "until interrupts roll control",
