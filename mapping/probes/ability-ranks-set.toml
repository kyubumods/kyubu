# Recorded with kyubu_probe, the Kyubu loader of task 5.2 of add-ability-api (ability_rank_bind: the detours of load_character and
# save_character, the ranks file) and, where `mods` has it, mods-dev/ability_api_proto, unattended under Wine 9.0 (WSL, Xvfb, software
# rendering): kmap probe replay, setup menu with clicks as input steps. The Save/ is the prepared one of record character-vanilla-refusal (slot 0
# the level-34 `testi`, slot 1 `Tester`, the world "testopia"), and the ranks file of the earlier record of the chain
# (evidence/ability-ranks-2026-10-05/run52.sh copies each run's Save/ into the next sandbox: the game "starts again").
id = "ability-ranks-set"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-05"
steps = [
    "Wine replay on the prepared Save (slot 0 the level-34 testi, slot 1 Tester, the world testopia; the sandbox of character-vanilla-refusal): SELECT on the first card and on the world",
    "console: ability rank (the default), ability_rank_set 2, the command, ability_rank_set 9 (clamped to the maximum 3), ability_rank_set 0, then the command with 3: the ranks file is written at each change"
]
observations = [
    "Wine run 2 passed (run 1 failed: the probe could not trace load_character because the loader's own detour is at its start; the Lua wrappers of ability_rank_get/set were missing in prelude.lua). Evidence: evidence/ability-ranks-2026-10-05/ (README, set/). The rank went 1, 2, 3 (9 clamped), 0, 3 through ability_rank_set and the console command; the ranks file held slot 0, name testi, ability_api_proto:burst 3; slot \"4\" showed the icon at rank 2 and was grey and empty at rank 0",
]

[[confirms]]
entry = "character_select_click"
observed = "the controller's selected index (+0x800A04) is the slot SELECT loads; the loader's detour of load_character selects that slot's ranks"

[[confirms]]
entry = "cube::CreatureData.name"
observed = "the player's name is the key check of the ranks file"

[replay]
host = "Cube.exe"
setup = "menu"
seconds = 420
mods = ["mods-dev/ability_api_proto"]
input = [
    "click 511 457", "wait 10", "move 512 119", "wait 3", "click 691 205", "wait 8", "shot 01-first", "move 512 230", "wait 3", "click 691 322", "wait 20", "shot 02-world",
    "console ability rank ability_api_proto:burst",
    "console ability_api_proto:rankget",
    "console ability_api_proto:rankset2",
    "console ability rank ability_api_proto:burst",
    "console ability_api_proto:rankset9",
    "shot 03-rank3",
    "console ability_api_proto:rankset0",
    "console ability rank ability_api_proto:burst",
    "shot 04-rank0",
    "console ability rank ability_api_proto:burst 3",
    "console ability rank ability_api_proto:burst",
]
script = """
log ability-ranks-set: task 5.2 of add-ability-api, the ranks of the played character
wait world
wait 300
expect character_select_click value u32 == 0 [@0x7691C8] + 0x800A04
expect - hooks == 0
"""
