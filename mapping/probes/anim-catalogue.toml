# Task 4.5 of add-ability-animation (the pose catalogue, D8): mods-dev/anim_catalogue_proto forces the local player into each vanilla mode id 0 to 110 in turn (the
# ability-force technique: current_mode and mode_start_time written on every draw) with the mode time pinned at 100, 450 and 800 ms, in three steps of five draws.
# A mid hook at the join site of draw_creature (0x41F135) logs, per step, the mode the game left, the pose id and the time of the draw record and the smoothed hand
# vectors; the second step logs "animcat: shotNNN" and the input takes a screenshot (the camera zoomed out by 3 wheel ticks first). The player is the level-1 human
# warrior Tester of the replay's setup, with his club: the class byte alone does not change the equipment (task 2.4), so the other classes are not drawn.
id = "anim-catalogue"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-07"
steps = [
    "Wine replay: gamepilot made the character Tester (human male warrior) and a new world; the mod waited 80 s after the first draw of the player",
    "camera zoomed out with 3 wheel ticks; 111 phases (mode 0 to 110) of three steps, a screenshot in the second step of each",
]
observations = [
    "Wine replay 1 passed (evidence/ability-animation-2026-10-07/anim-catalogue/run1/: 65 screenshots, latest.log) for modes 0 to 64; at mode 65 the game stopped drawing (one sample at step 1, pose 48, then no log line of the mod until the replay's script ended): modes 65 to 110 are in anim-catalogue-b and -c",
    "the pose id of each mode is in the table of the evidence README; the pose ends at the mode's duration (the draw then reads pose 0 and time 0)"
]

[[confirms]]
entry = "draw_creature"
observed = "the record's pose id for each forced vanilla mode, read at the join site: the catalogue table of the evidence README"

[replay]
host = "Cube.exe"
