# A loader and mod check, not a game observation: the signals of an `expr` track at draw time (add-ability-animation task 8.3, design D11). The mod
# mods-dev/anim_signals_proto has one clip, `charge`, whose tracks read `charge`, `speed` and `rank`: the weapon hand turns by 90 degrees times the
# charge, the head tips by the ground speed (at most 20) and rolls by the rank. It puts the clip on the local player with the preview clock, so the pose
# is worn whatever the player does, and keeps mp at 1. The player's own vanilla mode then drives the signal: a held right button is a hold mode and builds
# charged_mp (probe ability-costs), a held W gives a velocity. A mid hook at the join site of draw_creature logs charged_mp, the velocity and the vectors the
# draw reads there. Recorded with kyubu_probe, unattended under Wine 9.0 (WSL, Xvfb).
id = "anim-signals"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-11"
steps = [
    "Wine replay in dev mode: gamepilot made the character Tester and a new world; the mod waited 60 s after the first draw of the player, then called animation_preview(anim_signals_proto:charge, 300)",
    "wheel down 12, screenshot 00-idle (no charge, no speed); the right mouse button held 6 s (a hold mode charges), screenshot 01-after; W held 4 s, screenshot 02-walk",
]
observations = [
    "Wine replay 1 passed (evidence/anim-signals-2026-10-11/: 00-idle.png, 01-after.png, 02-walk.png, latest.log): the mod's mid hook installed, `animation_preview` returned true 60 s after the first draw, and no WARN or ERROR line came from the provider",
    "idle (mode 0): charged_mp 0, velocity 0, and the join site read hand_r euler 0 0 0 and head euler 0 0 1: the rank of a preview is 1 (head z = rank), charge and speed are 0",
    "right button held (mode 59, a hold mode, mp kept at 1): charged_mp rose 0.1192, 0.1953, 0.2706, 0.3490 ... 0.9748, then 1.0000 (capped at mp), and at every sample the hand_r euler x read charge * 90 (10.724 for 0.1192, 31.411 for 0.3490, 87.730 for 0.9748, 90.000 for 1.0000): the pose follows the charge, draw by draw",
    "after the release (mode 60, the spend): charged_mp 0 and the hand_r euler 0 0 0 in the same frame the mode changed",
    "W held (mode 60 still, then 0): velocity y 11.67 and 11.57 (x -0.00, z 0.00 and -0.09) read a head euler x of 21.667 and 21.567, and at a stand-still (velocity 0.01) 0.014: the head x is the speed plus a constant 10.000, which is the game's own head pitch while walking (the base of the `add` track; not read apart from the clip); the vertical velocity of 0.09 did not enter",
    "the screenshots show the player walking with the head tipped forward (02-walk.png); the hand is not in the picture of 01-after.png because the charge was spent",
]

[[confirms]]
entry = "cube::CreatureData.charged_mp"
observed = "the pose provider reads it at the join site of draw_creature for an `expr` track: 0.12 to 1.0 (capped at mp) while a hold mode (59) was held, and 0 after the release"

[[confirms]]
entry = "cube::CreatureData.velocity"
observed = "the length of x and y read for an `expr` track: 11.67 and 11.57 while walking, 0.01 and 0 at a stand-still; the z component (a fall) is not in it"

[[confirms]]
entry = "draw_creature"
observed = "the `expr` tracks of a clip worn through the preview clock read the signals of the draw at the join site: hand_r euler x = charge * 90 over a held hold mode, head euler x = the ground speed (plus the game's own head pitch), head euler z = the rank (1)"

[replay]
host = "Cube.exe"
setup = "new-world"
seconds = 420
mods = ["mods-dev/anim_signals_proto"]
input = [
    "until animsig: preview on",
    "wheel down 12",
    "wait 5",
    "shot 00-idle",
    "hold mouse3 6",
    "wait 3",
    "shot 01-after",
    "hold w 4",
    "shot 02-walk",
    "wait 5",
]
script = """
log anim-signals: task 8.3 of add-ability-animation, the signals of a draw
wait world
wait 20
wait 150
log anim-signals: done
expect draw_creature value u32 != 0 [[@0x7691C8] + 0x8006C8] + 0x1498
"""
