# 07-20 copy of game-access-client (2026-10-26): the 07-02 record ported to Cube World Alpha 2013-07-20 (addresses translated);
# its observations are this build's own replays. The comment below is the 07-02 record's.
# Recorded with kyubu_probe on the Windows laptop (Windows 10, real Cube.exe), in a copy of the game with the Kyubu 1.0.1
# release installed and dev mode on (kmap probe replay, setup "menu"). The object types are read at run time from
# MSVC RTTI: an object's vtable pointer is at +0, the vtable's slot -1 points at its complete object locator, whose
# +0xC points at the type descriptor, whose name starts at +8 (".?AVWorld@cube@@", so +0xC holds "Worl").
id = "game-access-client-0720"
build = "cube-0x51EA955E"
kyubu = "1.0.1"
date = "2026-10-26"
steps = [
    "Read WinMain, the controller's constructor and Game::frame statically for the globals they use and the World",
    "Started Cube.exe with --kyubu-dev and kyubu_probe through kmap probe replay, and waited at the start menu",
    "Followed 0x76B1C8 and GameController+0x2E4 and read each object's RTTI type name through its vtable",
    "Traced cube::GameController::render and compared its this with the pointer at 0x76B1C8",
]
observations = [
    "ported from the 07-02 record on 2026-10-26 (addresses translated); the 07-20 replay results follow",
    "replay 1 (2026-10-26) passed under Wine: game_controller at @0x76B1C8 is set, GameController::render ran 22 times, the GameController and World checks held, no probe hooks left (evidence/retarget-0720-2026-10-26/replays/game-access-client-0720-1.md)",
]

[[confirms]]
entry = "cube::game_controller"
observed = "holds the one cube::GameController, the same object Game::frame renders"

[[confirms]]
entry = "cube::GameController"
observed = "the object at [0x76B1C8] has the RTTI type .?AVGameController@cube@@"

[[confirms]]
entry = "cube::GameController.world"
observed = "+0x2E4 is a complete cube::World (RTTI name, complete-object offset 0)"

[[confirms]]
entry = "cube::World"
observed = "embedded at GameController+0x2E4, ending before the members that follow it"

[replay]
host = "Cube.exe"
setup = "menu"
seconds = 90
script = """
log game access, client side: the controller global and the World inside it
wait 5
# cube::game_controller: set, and a cube::GameController (".?AVGameController@cube@@": "Game", "Cont")
expect cube::game_controller value u32 != 0 @0x76B1C8
expect cube::GameController value u32 == 1701667143 [[[[@0x76B1C8]] - 4] + 0xC] + 0xC
expect cube::GameController value u32 == 1953394499 [[[[@0x76B1C8]] - 4] + 0xC] + 0x10
expect cube::GameController value u32 == 0 [[[@0x76B1C8]] - 4] + 4
# GameController.world: a complete cube::World (".?AVWorld@cube@@": "Worl", "d@cu"; locator offset 0)
expect cube::GameController.world value u32 == 1819438935 [[[[@0x76B1C8] + 0x2E4] - 4] + 0xC] + 0xC
expect cube::GameController.world value u32 == 1969438820 [[[[@0x76B1C8] + 0x2E4] - 4] + 0xC] + 0x10
expect cube::World value u32 == 0 [[[@0x76B1C8] + 0x2E4] - 4] + 4
# the World's model table (World+0x1C+4) is the 7.1 model vector
expect cube::World value u32 != 0 [@0x76B1C8] + 0x2E4 + 0x20
# the controller Game::frame renders is the one in the global: this - [0x76B1C8] = 0 lands on the type name
trace add cube::GameController::render
trace start
wait 3
trace stop
expect cube::game_controller calls cube::GameController::render > 20
expect cube::game_controller value u32 == 1701667143 [@0x76B1C8] - ecx(cube::GameController::render) + @0x765BF8
expect - hooks == 0
"""
