inspect set data.mode_start_time 0
wait 1
watch
inspect creatures [@0x7691C8] + 0x2DC
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 0] + 0x18]
expect cube::World::canHit watch nhp unchanged
watch clear
# hostile_type 6: `spawner hostile 6` puts five green slimes 12 to 28 blocks north of the player (the name tag: the crosshair is over one of the far ones) and one half a block east of it (the hit); the console step runs 20 to 40 s late under Wine, the shot 35 s after it
log 3.4: hostile 6
wait 90
inspect creatures [@0x7691C8] + 0x2DC
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 0] + 0x18]
# the creature with the lowest id (the map's leftmost node) is the one spawned last: the one next to the player
expect cube::CreatureData.hostile_type value u8 == 6 [[[[@0x7691C8] + 0x2E0] + 0] + 0x18] + 0x60
watch nhp f32 [[[[@0x7691C8] + 0x2E0] + 0] + 0x18] + 0x16C
inspect player [@0x7691C8]
inspect set data.mp 1
log 3.4: hostile 6 cyclone
