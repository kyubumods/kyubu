expect cube::World::canHit watch nhp unchanged
watch clear
# hostile_type 3: `spawner hostile 3` puts five green slimes 12 to 28 blocks north of the player (the name tag: the crosshair is over one of the far ones) and one half a block east of it (the hit); the console step runs 20 to 40 s late under Wine, the shot 35 s after it
log 3.4: hostile 3
wait 90
inspect creatures [@0x7691C8] + 0x2DC
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 0] + 0x18]
# the creature with the lowest id (the map's leftmost node) is the one spawned last: the one next to the player
expect cube::CreatureData.hostile_type value u8 == 3 [[[[@0x7691C8] + 0x2E0] + 0] + 0x18] + 0x60
watch nhp f32 [[[[@0x7691C8] + 0x2E0] + 0] + 0x18] + 0x16C
