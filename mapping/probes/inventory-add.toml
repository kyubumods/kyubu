# Recorded with kyubu_probe and the Kyubu 1.0.1 loader (this checkout, MinGW build), unattended under Wine 9.0 (WSL on the Windows
# laptop, Xvfb, software rendering): kmap probe replay with gamepilot, which creates the level-1 human warrior "Tester" and a new
# world, with the developer mod give_item. Its raw prototype calls the game's inventory insert (0x46EEE0, ECX = Creature+0x11DC, item and
# bag -1) for the local player and reads the bags back: a weapon and a random item must land in a bag, and gold coins must raise the coin
# counter at +0x128 of the bags. P is the player's cube::Creature, [[@0x7691C8] + 0x8006C8].
id = "inventory-add"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-04"
steps = [
    "Wine replay: gamepilot made the character Tester and a new world with give_item installed; waited 15 s there",
    "The console command give_item:give gave a weapon (type 3, sub_type 17, level 21, rarity 2), 500 gold coins and a random item of stored level 30, rarity 1 (the game's generator)",
    "The input opened the inventory with i and took a screenshot",
]
observations = [
    "Wine replay 2 passed (replay 1 too, before the level was read back), no fault. The raw prototype of the give_item mod called inventory_add (0x46EEE0) with ECX = Creature+0x11DC, the item and bag -1",
    "a weapon (type 3, sub_type 17, level 21, rarity 2) landed in bag 0 slot 3, a second one in slot 5 (no stacking); reading the bags back through the tabs vector at +0 (a vector of vectors of 0x11C-byte slots, a count word then the ItemData) found type, sub_type, level, rarity, material and modifier as written",
    "a random item from the game's generator (item_generate, `this` = the World at GameController+0x2DC; type 3, sub_type 8 or 12, stored level 30, rarity 1) landed in bag 0 slot 4 with the generated fields",
    "500 gold coins (type 12, material 11, level word 500) were not put in a slot: the coin counter at Creature+0x11DC+0x128 (Creature+0x1304) went from 0 to 5,000,000 (500 times 10,000)",
    "the screenshot after opening the inventory with i shows 500 G; the game reads the counter live. The bag grid was opened after the inserts, so a window that is already open when an item is added was not tried",
]

[[confirms]]
entry = "cube::World.joined"
observed = "0 in single-player"

[[confirms]]
entry = "cube::Inventory.coins"
observed = "0 before, 5,000,000 after giving 500 gold coins; the inventory screen shows 500 G"

[[confirms]]
entry = "cube::Creature.inventory"
observed = "the bags of the local player: items landed in bag 0 and the coin counter moved, through the pointer + 0x11DC"

[[confirms]]
entry = "inventory_add"
observed = "called with the bags, an item and bag -1: a weapon, a generated item and coins all arrived as described"

[replay]
host = "Cube.exe"
setup = "new-world"
seconds = 400
mods = ["mods-dev/give_item"]
input = [
    "until ia: start",
    "console give_item:give 3 17 21 2", "wait 3",
    "console give_item:give coins 500 gold", "wait 3",
    "console give_item:give random 30 1", "wait 3",
    "console give_item:give 3 17 21 2", "wait 3",
    "key i", "wait 10", "shot 01-inventory",
    "until ia: done",
]
script = """
log inventory insert (the game API's creature_give_item)
wait world
wait 15
inspect player [@0x7691C8]
expect cube::World.joined value u8 == 0 [@0x7691C8] + 0x390
inspect cube::Creature [[@0x7691C8] + 0x8006C8]
log ia: start
wait 60
inspect cube::Creature [[@0x7691C8] + 0x8006C8]
expect cube::Inventory.coins value u32 >= 5000000 [[@0x7691C8] + 0x8006C8] + 0x1304
log ia: done
wait 5
"""
