# Recorded with kyubu_probe and the Kyubu 1.0.1 loader (this checkout, MinGW build), unattended under Wine 9.0 (WSL on the Windows
# laptop, Xvfb, software rendering): kmap probe replay with gamepilot, which creates the level-1 human warrior "Tester" and a new
# world, with the mods equip_gate_probe and level_rework. Task 6.2 of add-level-rework (M5, M8): the equip gate compares an item's power with
# the character's level, and a kill drop's generator call gets item_level(N). The console command equip_gate_probe:items calls
# can_equip_item with a copy of the player's weapon at other stored levels on stand-in warriors; the script then kills 40 level-61 and 20
# level-100 victims (a forced cyclone, as item-level-sites) and the mod logs each conversion ("item level N -> M (caller ...)").
# Superseded on 2026-10-04 by task 6.6: the item-level rule recorded here (stored level item_level(N), 61 -> 32) was replaced by item_stored_level(N) = 2000 + N (61 -> 2061); see the item-scale and item-scale-kills records. The observations below stay as they were made.
id = "item-levels"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-04"
steps = [
    "Wine replay: gamepilot made the character Tester and a new world with level_rework and equip_gate_probe installed; waited 15 s there",
    "The console command equip_gate_probe:items called can_equip_item with the player's weapon at ten (creature level, stored level) pairs on stand-in warriors",
    "The script traced item_level_reroll and the kill-drop level site (the generators cannot be traced: the mod hooks them), then killed 40 victims of level 61 and 20 of level 100 (hostile type 1, hp 1, stunned, half a block away, forced cyclone)",
]
observations = [
    "Wine replay 3 passed, no fault (replays 1 and 2 failed only on the expectation of a gear drop through 0x599CB5: 28 and 60 kills made none; replay 1 had one through item_generate_any)",
    "equip_gate_probe:items, 10 cases on stand-in warriors with a copy of the player's weapon: can_equip_item agreed with the mod's rule (the item's power, 1 to 100, at most the character's level, and the game's class rule) in all 10; 4 differ from vanilla's power-against-power rule: creature 50 with stored 50 (power 72) refused, creature 50 with stored 21 (power 51) refused, creature 100 with stored 1981 and with stored 600 accepted",
    "kill drops (60 kills: 40 of level 61, 20 of level 100; 37 typed drops, so the drop function ran for every kill): item_generate returned to 0x599CFE once, its level 61 converted to 32 = item_level(61) (the mod's log line `item level 61 -> 32 (caller 0x00599CFE)`; 0x599CB5 was reached once with ESI 61). Replay 1 (28 kills) logged the same conversion at 0x0059A4CF (item_generate_any in a kill drop)",
    "only 1 gear drop in 60 kills (and 1 in 28), against 1 to 3 in 24 in task 6.1 without the mod. Not explained: a hypothesis is that the kill leaves the player at level 100 and a victim below the killer's level drops less; not tested",
    "the generators cannot be traced here: the mod's hooks are on them, and the probe refuses a function that already starts with a jump. The mod's own log line is the evidence of the level passed on",
]

[[confirms]]
entry = "can_equip_item"
observed = "through the mod's hook: 10 of 10 cases agreed with the rule (item power at most the character's level)"

[[confirms]]
entry = "cube::World.joined"
observed = "0 in single-player"

[[confirms]]
entry = "kill_drop_level_site"
observed = "passed once in 60 kills with ESI 61 (the victim level)"

[[confirms]]
entry = "item_level_reroll"
observed = "846 and 703 calls while tracing (the creature set-up and the kill drop)"

[[confirms]]
entry = "kill_drop_typed_item_site"
observed = "passed 37 times in 60 kills"

