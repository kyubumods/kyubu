# Recorded with kyubu_probe and the Kyubu 1.0.1 loader (this checkout, MinGW build), unattended under Wine 9.0 (WSL on the Windows
# laptop, Xvfb, software rendering): kmap probe replay with gamepilot, which creates the level-1 human warrior "Tester" and a new world, with the
# mods equip_gate_probe and level_rework. Task 6.6 of add-level-rework: with the item scale installed, a kill drop's generator call gets
# item_stored_level(N) (the log reads "item level 61 -> 2061"), the reroll runs on the mod level, and can_equip_item still agrees with the rule.
# The script is the item-levels script cut to 30 kills of level 61 and 10 of level 100, and it does not trace item_level_reroll (the mod hooks it now).
id = "item-scale-kills"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-04"
steps = [
    "Wine replay: gamepilot made the character Tester and a new world with level_rework and equip_gate_probe installed; waited 15 s there",
    "The console command equip_gate_probe:items called can_equip_item with the player's weapon at ten (creature level, stored level) pairs on stand-in warriors",
    "The script traced the kill-drop level site (the generators and item_level_reroll cannot be traced: the mod hooks them), then killed 30 victims of level 61 and 10 of level 100 (hostile type 1, hp 1, stunned, half a block away, forced cyclone)",
]
observations = [
    "Wine replay 3 passed (runs 1 to 3: runs 1 and 3 held the expectation of a gear drop through 0x599CB5 with 2 calls each, run 2 had none in 40 kills and failed that expectation: gear drops are rare, as noted in item-levels). Run 3: the kill drops log \"item level 60 -> 2060\" and \"item level 61 -> 2061\" (caller 0x599D19, the alt generator of the kill drop), and the reroll hook that follows logs \"item level reroll 2060 -> 2063 (range 55 to 65)\" and \"2061 -> 2063 (range 56 to 66)\": a whole-level window of 5 either side, in the mod scale",
    "equip_gate_probe:items, 10 cases: can_equip_item agreed with the mod's rule in all 10 (0 mismatches), 4 differ from vanilla's; the gate reads the mod level of a mod item as before",
    "the generators and item_level_reroll cannot be traced here: the mod's hooks are on them, and the probe refuses a function that carries a hook",
]

[[confirms]]
entry = "can_equip_item"
observed = "through the mod's hook: 10 of 10 cases agreed with the rule (item power at most the character's level, and the game's class rule)"

[[confirms]]
entry = "cube::World.joined"
observed = "0 in single-player"

[[confirms]]
entry = "kill_drop_level_site"
observed = "passed twice in 40 kills with ESI 61 (the victim level); one run in three had no gear drop"

[[confirms]]
entry = "kill_drop_typed_item_site"
observed = "passed 31 times in 40 kills"

[replay]
host = "Cube.exe"
setup = "new-world"
seconds = 900
mods = ["mods-dev/equip_gate_probe", "mods-gameplay/level_rework"]
input = [
    "until il: gate", "console equip_gate_probe:items",
]
