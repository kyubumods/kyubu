# 07-20 copy of kill-xp-replacement (2026-10-26): the 07-02 record ported to Cube World Alpha 2013-07-20 (addresses translated);
# its observations are this build's own replays. The comment below is the 07-02 record's.
# Re-recorded on 2026-10-04 with the current XP table (design D3).
# Recorded with kyubu_probe and the Kyubu 1.0.1 loader (this checkout, MinGW build), unattended under Wine 9.0 (WSL on the Windows
# laptop, Xvfb, software rendering): kmap probe replay with gamepilot, which creates the level-1 human warrior "Tester" and a new
# world. Task 4.3 of add-level-rework: the mod level_rework replaces the kill XP at cube::World::killXpSite (0x59638D) with
# X(L) * 20 (a large kind) * 10 (flag 0x200) * 2^(p/4), 0 for flag 0x800. The tracer cannot trace the hooked site, so the replacement
# shows in the XP the player gains. As in kill-xp, each target is the creature with the top id T = [[[[@0x76B1C8] + 0x2E8] + 8] + 0x18],
# made hostile, stunned and put half a block from the player; the player's forced cyclone (mode 86) kills it. P is the player's
# cube::Creature, [[@0x76B1C8] + 0x8006D0].
id = "kill-xp-replacement-0720"
build = "cube-0x51EA955E"
kyubu = "1.0.1"
date = "2026-10-26"
steps = [
    "Wine replay: gamepilot made the character Tester (human male warrior) and a new world with the mod level_rework (mods-gameplay) installed beside kyubu_probe; waited 15 s there",
    "11 kills of a level-1 monster (10 with the player at its own XP, and the last with 25 XP written first), each on the creature with the top id: made hostile, hp 1, armour factor 0, stunned, put half a block from the player, then a forced cyclone (mode 86) for 3 s, mode 0 for 1 s, mode 4 for 2 s",
    "Five more kills with the player at level 40 and 0 XP (7 XP for the last): a level-40 monster with no flag, with power_base 4, with entity type 109 (a large kind: is_giant_creature is true), with flag 0x200 and with flag 0x800",
]
observations = [
    "ported from the 07-02 record on 2026-10-26 (addresses translated); the 07-20 replay results follow",
    "replay 1 (2026-10-26) passed under Wine: killRecordXpSite and kill_record_apply ran 16 times each; current_xp and level took the expected values (evidence/retarget-0720-2026-10-26/replays/kill-xp-replacement-0720-1.md)",
]

[[confirms]]
entry = "cube::World::killRecordXpSite"
observed = "passed 16 times in 16 kills, once per kill, after the mod wrote the new XP at killXpSite"

[[confirms]]
entry = "kill_record_apply"
observed = "called 16 times in 16 kills, once per kill"

[[confirms]]
entry = "cube::CreatureData.current_xp"
observed = "1 per level-1 kill, then 9, 18, 180 and 90 for level-40 victims (plain, +4, large kind, flag 0x200), and no gain for flag 0x800"

[[confirms]]
entry = "cube::CreatureData.level"
observed = "2 after one kill at 25 XP (the boundary of the first level), with XP 0"

[replay]
host = "Cube.exe"
setup = "new-world"
seconds = 1800
mods = ["mods-gameplay/level_rework"]
