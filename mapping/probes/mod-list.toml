    "move 512 559", "wait 2", "click 512 559", "wait 8", "shot 01-list",
    "console mod_manager:state",
    "click 150 433", "wait 4", "shot 02-select", "console mod_manager:state",
    "click 150 465", "wait 3", "shot 03-user",
    "click 386 276", "wait 3", "shot 04-enabled", "click 386 276", "wait 3", "click 386 276", "wait 3", "shot 05-problems",
    "click 62 276", "wait 2", "click 62 276", "wait 2", "click 62 276", "wait 3",
    "click 190 225", "wait 2", "type fix", "wait 4", "shot 06-search", "console mod_manager:state",
    "key Escape", "wait 3", "console mod_manager:state", "shot 07-after-escape",
    "click 150 433", "wait 3", "click 560 488", "wait 3", "shot 08-chip", "console mod_manager:state",
