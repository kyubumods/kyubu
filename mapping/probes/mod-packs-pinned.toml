    "run 2 passed (pinned-run2): the plan reads CAT_ALPHA / WILL CHANGE 1.1.0 > 1.0.0 (547 B), CAT_BETA / WILL DOWNLOAD 1.0.0 (527 B), CAT_LIB / WILL DOWNLOAD 1.0.0 AGAIN, NOT VERIFIED (526 B), each under its name because the line is wider than the column",
