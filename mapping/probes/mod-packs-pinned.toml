# at the full 1024 x 768 window (mod-packs shows the Verified case after a restart, whose window Xvfb cuts).
id = "mod-packs-pinned"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1 (API 1.2)"
date = "2026-10-25"
steps = [
    "Same ModManager as mod-packs, with the test catalog's cat_alpha 1.1.0 and cat_lib 1.0.0 source folders copied into mods\\",
    "Replayed at the start menu under Wine at 1024 x 768: open the page, fetch the good test catalog, open Install / Modpacks and the pack, open its Actions menu, then type in the search box",
]
observations = [
    "run 1 passed (evidence/mod-packs-2026-10-25/pinned-run1): both folders load and read Unverified; the log reads pack plan cat_pack: ok, download cat_alpha 1.1.0>1.0.0, download cat_beta 1.0.0, download cat_lib 1.0.0>1.0.0, disable kyubu_probe 1.0.0, disable mm_fixture_catalog 1.0.0, settings 1+",
