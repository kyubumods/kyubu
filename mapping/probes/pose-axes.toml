# Task 2.8 of add-ability-animation (the rig reference): mods-dev/pose_axes_proto writes the euler of one part of the local player's draw record at the join site
# 0x41F135 (found by task 2.4; EDI is the record, a write goes through a float*) on every draw, plus or minus 30 degrees on one axis, in phases of 5 s, and logs a
# "poseaxes: shotNN" line 2 s into each phase, where the input takes a screenshot (the camera zoomed out by 3 wheel ticks first). Each part starts with a baseline phase
# (no write). The 42 phases of the front view (the player's own yaw) come first, then the same 42 in the left profile (the mod writes body_yaw 90, at Creature + 0x30).
# The parts are root, body, head, hand A, hand B and tail (the record offsets of the task 2.3 table).
id = "pose-axes"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-06"
steps = [
    "Wine replay: gamepilot made the character Tester (human male warrior) and a new world; the mod waited 40 s after the first draw of the player",
    "camera zoomed out with 3 wheel ticks; 84 phases of 5 s, a screenshot 2 s into each (see the header)",
]
observations = [
    "Wine replay 1 passed (evidence/ability-animation-2026-10-06/pose-axes-run1/: 84 screenshots, sheet-front.png, sheet-left.png, latest.log): all 84 shot lines appeared, no fault, the player stayed on the ground with the yaw write at Creature + 0x30",
    "head, body and root axes read plainly: x pitches (positive tips the top back), y rolls (positive tips the top toward the player's right), z turns (positive turns counter-clockwise from above, toward the player's left); the head moves alone, the trunk carries the hands and the club, the root carries everything",
    "hand A is the player's left hand (the right of the screen in the front view, the near hand in the left profile), hand B the right hand; a 30 degree write on a hand changes the fist's face and moves it by less than its width; the club on the back never followed a hand at idle",
    "the player's slot mask is 0x197: head, hair, body, hands, feet, the club; no tail slot, and the tail writes changed nothing in 14 phases; one other creature drawn had only the body slot",
    "the front view's root row starts in a turned view (about a third of a turn) and is frontal from the z-30 phase on; the cause is not known",
]

