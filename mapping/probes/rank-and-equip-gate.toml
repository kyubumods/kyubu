# part E: the dev mod equip_gate_probe calls can_equip_item eight times and creature_power nine times (the input runs its console command): stand-in creatures of
# level 0, 1, 21, 100 and 1981 and a copy of the player's weapon at level 1, 2, 21, 22 and 1981. The detour records the calls, the three
