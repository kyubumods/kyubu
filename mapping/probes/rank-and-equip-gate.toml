inspect set modifier 0
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 8] + 0x18]
trace start
log rr: R2 level 1 power_base 0: rank 0 + 0 + 1
inspect set data.current_mode 79
inspect set data.mode_start_time 0
wait 6
inspect set data.current_mode 0
inspect set data.mode_start_time 0
wait 1
trace stop
trace report
expect ability_power from ability_power 0x617E8B this [[[[@0x7691C8] + 0x2E0] + 8] + 0x18]
expect ability_power_rank_site calls @0x43F643 >= 1
expect ability_power_rank_join reg @0x43F64B eax == 1
# R3 level 100 power_base 4: rank 50 + 4 + 1
inspect creatures [@0x7691C8] + 0x2DC
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 8] + 0x18]
inspect set data.hostile_type 1
inspect set data.show_patch_time -1
inspect set data.level 100
inspect set data.power_base 4
inspect set data.max_hp_multiplier 10000
inspect set data.hp 1000
inspect set data.pos.x from [[@0x7691C8] + 0x8006C8] + 0x10 plus 0x280000
inspect set data.pos.y from [[@0x7691C8] + 0x8006C8] + 0x18
inspect set data.pos.z from [[@0x7691C8] + 0x8006C8] + 0x20
inspect cube::ItemData [[[[@0x7691C8] + 0x2E0] + 8] + 0x18] + 0x1150
inspect set modifier 0
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 8] + 0x18]
trace start
log rr: R3 level 100 power_base 4: rank 50 + 4 + 1
inspect set data.current_mode 79
inspect set data.mode_start_time 0
wait 6
inspect set data.current_mode 0
inspect set data.mode_start_time 0
wait 1
trace stop
trace report
expect ability_power from ability_power 0x617E8B this [[[[@0x7691C8] + 0x2E0] + 8] + 0x18]
expect ability_power_rank_site calls @0x43F643 >= 1
expect ability_power_rank_join reg @0x43F64B eax == 55
# R4 hostile_type 0 (the rule is off): rank 0
inspect creatures [@0x7691C8] + 0x2DC
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 8] + 0x18]
inspect set data.hostile_type 0
inspect set data.show_patch_time -1
