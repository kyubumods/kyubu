[[confirms]]
entry = "cube::World::abilityDispatchSite"
observed = "the dispatch site reaches the server's Uppercut: the mod's callbacks and the deferred strike run from it"

[replay]
host = "Server.exe"
setup = "menu"
client = "join"
fast_join = true
seconds = 420
mods = ["mods-gameplay/emtweaks", "mods-gameplay/skills_unleashed", "mods-dev/mp_fill", "mods-dev/su_rank", "mods-dev/su_dummy"]
input = [
    "shot 01-joined",
    "until slot: press",
    "click 820 384",
    "wait 2",
    "hold 4 0.9",
    "wait 4",
    "shot 02-after",
]
script = """
log server-berserker-0720: task 5.2 of add-skills-unleashed-multiplayer
trace args 3
trace add @0x537BC4
trace add @0x4257BC
trace start
wait 140 until calls @0x4257BC >= 1
log slot: press
wait 90 until calls @0x537BC4 >= 1
trace stop
trace report
expect cube::World::abilityDispatchSite calls @0x537BC4 >= 1
log server-berserker-0720: done
"""
