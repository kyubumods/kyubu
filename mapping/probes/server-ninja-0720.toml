# client = "join"). The client, made a Ninja by su_rank, holds key 4; at its clip's `throw` marker it sends `bomb { from, view }` on
# skills_unleashed:ability (design D13). The server checks it against its own copy of the player, flies its own bomb on its own
# blocks, bursts it (hits within the splash), and runs true stealth on its monsters: the threat for the player below 0 on each
# monster that holds one, the player out of the first-target scan (cube::CombatBehavior::targetScanSite of Server.exe), and at the
# end the entries erased. It tells the clients `stealth_on` and `stealth_off` (D14). su_dummy holds a monster 3 blocks in front.
# From run 4 (task 8.6a): a watcher, a second joined client, draws the bomb, the burst and the stealth look on the thrower from the
# server's `bomb`, `burst`, `stealth_on` and `stealth_off` on skills_unleashed:world.
