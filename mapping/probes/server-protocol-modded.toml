# Recorded with kyubu_probe and the Kyubu 1.1 loader in development (MinGW build), unattended under Wine 9.0 (WSL on the Windows
# laptop): kmap probe replay starts Server.exe WITH the level_rework mod (no mods_on: the client has it too), then a Kyubu-loaded
# Cube.exe with the mod that joins 127.0.0.1 with a new character (client = "join"). Task 8.3 of add-level-rework: the server's half of
# the protocol patch (design D7, mid hook at Net::acceptVersionSite) and the server's level check (S8, creature_update_level_site).
# The probe cannot trace the two sites the mod hooks (0x42554E, 0x415B47): the mod's own log lines show them, the join branch
# (Net::acceptJoinSite) and the refusal branch are traced. After the join the script writes level 105 into the server's copy of the
# player, so that the next creature update of that client reaches the level check with a level outside 1 to 100.
id = "server-protocol-modded"
build = "server-0x51D2CE9B"
kyubu = "1.1"
date = "2026-10-04"
steps = [
    "Wine replay: Server.exe and a joined Cube.exe both with level_rework; the script waits 110 s for the join",
    "traced the join branch and the wrong-version reply of server_accept_loop, and cube::World::update's World for the player's creature",
    "wrote level 105 into the server's copy of the player and waited for the next update of that client",
]
observations = [
    "Wine replay 10 (passed, the final run, 3 of 3 expectations held; evidence in kyubu-mapping/evidence/server-protocol-compat-2026-10-04/, files modded-*). Runs 1 to 6 found two faults, fixed before run 7 (run 7 passed; runs 8 and 9 repeated it after the level-0 exception was removed): the mapped level site 0x415B47 followed the read of +0x190, not the level (the entry is now 0x415B05, after the call at 0x415B00 that reads +0x180; the copy is a CreatureData, not a Creature), and the check of the receive loop's frame used a wrong distance. Run 6 showed that setting the loop's exit flag alone ends the loop but leaves the socket open (the client stayed connected): the mod also shuts the socket down",
    "modded client, modded server: the server's log says `client version 0x4B4C0001: accepted (a client with the mod)`; the join branch (0x4255AC) ran once and the refusal's send (0x42556E) never; the client is in the world (01-joined.png: level 1 warrior, 'CONNECTED.'), and the server has 18 creatures in its World",
    "the level check saw level 1 in the first updates of that client (`update 1 carries level 1`).",
    "A level outside the range: the probe wrote level 105 into the server's copy of the player (the client has no probe, and its own level cannot exceed 100); the next update of that client logged `level check: a player sent level 105, outside 1 to 100: disconnected (the receive loop ends, the socket is shut down)`. The client log has `disconnected from server` 4 ms later and 03-later.png shows DISCONNECTED; the server's World went from 18 to 17 creatures. The level in the copy is clamped to 100 before the write-back, so 105 never reaches the World",
    "so the spec's 'A level outside the range' is checked with the level edited at the server, not sent by a client; a client that sends it is not reproducible with a client whose load check clamps",
]

[[confirms]]
entry = "Net::acceptJoinSite"
observed = "1 call in run 10: the modded client joined a modded server (version 0x4B4C0001 turned into 3 by the mod's hook)"

[[confirms]]
entry = "Net::acceptWrongVersionReplySite"
observed = "0 calls in run 10: the modded server did not refuse the modded client"

[[confirms]]
entry = "Net::acceptVersionSite"
observed = "hooked by the mod, so not traced: the mod's log line shows the version it read and what it did"

[[confirms]]
entry = "creature_update_level_site"
observed = "hooked by the mod, so not traced; moved to 0x415B05 in 8.3 (the old address followed another field); the mod's log shows the level read (1 for a new character) and the refusal of 105"

[replay]
host = "Server.exe"
setup = "menu"
client = "join"
mods = ["mods-gameplay/level_rework"]
seconds = 300
input = [
    "until 8.3: joined",
    "shot 01-joined",
    "until 8.3: level check done",
    "wait 8",
    "shot 02-after-level-105",
    "wait 20",
    "shot 03-later",
]
script = """
log level_rework on both sides: the server takes the modded client (task 8.3 of add-level-rework)
trace args 4
trace add @0x427FF0
trace add @0x4255AC
trace add @0x42556E
trace start
wait 110
trace stop
trace report
expect Net::acceptJoinSite calls @0x4255AC >= 1
expect Net::acceptWrongVersionReplySite calls @0x42556E == 0
log 8.3: joined
inspect creatures [ecx(@0x427FF0) + 4]
inspect cube::Creature [[[[ecx(@0x427FF0) + 4] + 4]] + 0x18]
log 8.3: level 105
inspect set data.level 105
wait 15
log 8.3: level check done
wait 30
log 8.3: after the disconnect
inspect creatures [ecx(@0x427FF0) + 4]
wait 2
expect - hooks == 0
"""
