# Re-recorded on 2026-10-04 with the current XP table (design D3).
# Recorded with kyubu_probe and the Kyubu 1.0.1 loader (this checkout, MinGW build), unattended under Wine 9.0 (WSL on the Windows
# laptop, Xvfb, software rendering): kmap probe replay with gamepilot, which creates the level-1 human warrior "Tester" and a new
# world, with the mod level_rework installed beside kyubu_probe. Task 4.4 of add-level-rework: "A level-up's points". Task 3.5 found
# that no per-level grant exists: the skill panel's budget is computed from the level (2 * level - 2). So the mod needs no hook, and
# this record checks that claim with the mod on, through the mod's own level-up: a level-9 character holding 90 XP kills a level-10
# monster (the mod pays 3 XP, X(10) = round((8 + 2 * 10) / 10)), 93 passes the 92 that level 9 needs, and the character
# is level 10 with 1 XP. The panel's limit (EAX at 0x4DCCDF) is read before (16 = 2 * 9 - 2) and after (18 = 2 * 10 - 2): two more,
# as a vanilla level-up from 9 to 10 gives. P below is the player's cube::Creature, [[@0x7691C8] + 0x8006C8].
id = "skill-points-modded"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-04"
steps = [
    "Wine replay: gamepilot made the character Tester (human male warrior) and a new world with the mod level_rework (mods-gameplay) installed beside kyubu_probe; waited 15 s there",
    "Traced two sites: the Points text's limit (0x4DCCDF, a mid hook) and the skill panel's toggle (0x488EC0)",
    "Window A: the player's level written to 9 with 90 XP (level 9 needs 92 under the mod's table); the key X opened the skill panel; 70 s of trace; a screenshot (01-A-level9.png)",
    "Kill: the creature with the top id made hostile, level 10, hp 1, stunned and put half a block from the player; the player's forced cyclone (mode 86, as kill-xp) killed it: the mod pays 3 XP, 90 + 3 = 93, minus 92, gives level 10 with 1 XP",
    "Window B: the panel opened again at level 10 (02-B-level10.png)",
]
observations = [
    "Wine replay 10 (the re-recording of 2026-10-04 with the current table; evidence `evidence/skill-points-modded-2026-10-04/`) passed, 6 of 6 entries held; no fault, and the probe's hooks were all removed at the end (hooks == 0)",
    "window A (level 9 with 90 XP, written directly): the Points text's limit site was passed 474 times and each of the last 32 passes had EAX = 16 = 2 * 9 - 2. The screenshot 01-A-level9.png shows the panel",
    "the kill (level-10 victim, forced cyclone): with the mod's kill XP the player went from level 9 with 90 XP to level 10 with 1 XP: 90 + 3 (X(10) = round((8 + 2 * 10)/10)) = 93, minus the 92 that level 9 needs under the mod's table",
    "window B (level 10 from that level-up): EAX = 18 = 2 * 10 - 2 (392 passes, last 32 all 18), and 02-B-level10.png shows LVL 10, POINTS: 0/18. The limit grew by 2, as a vanilla level-up from 9 to 10 gives (task 3.5 measured the vanilla run: 16 then 18). The mod's level_up_hook writes only the level, the XP and the HP, so nothing else could have changed the budget",
    "cosmetic, unexplained: the chat in 02-B-level10.png reads `YOU GAIN 90 XP` (the direct write of window A) and `YOU GAIN 1 XP`, not 3: the game seems to report the change of the stored XP, which the level-up reduced",
    "not tried: a click on a skill button (the add branch, 0x47BE34, stays static), spent ranks other than 0, mana cubes with the mod (task 3.5 saw that the panel text has no mana-cube term), Server.exe",
]

[[confirms]]
entry = "cube::SkillWidget::pointsLimitSite"
observed = "with level_rework on: EAX = 16 at level 9 (478 passes) and 18 at level 10 (376 passes) after the mod's level-up, 2 * level - 2 as in vanilla"

[[confirms]]
entry = "cube::GameController::toggleSkills"
observed = "called once when the key X was pressed, with the mod on"

[[confirms]]
entry = "cube::CreatureData.level"
observed = "9 -> 10 by a kill under the mod's level-up"

[[confirms]]
entry = "cube::CreatureData.current_xp"
observed = "90 + 3 - 92 = 1 after the kill at level 9 (mod table)"

[[confirms]]
entry = "cube::World.joined"
observed = "0 in single-player"

[replay]
host = "Cube.exe"
setup = "new-world"
seconds = 900
mods = ["mods-gameplay/level_rework"]
input = [
    "until sp: A open", "key x", "wait 12", "shot 01-A-level9",
    "until sp: A done", "key x", "wait 3",
    "until sp: B open", "key x", "wait 12", "shot 02-B-level10",
    "until sp: B done", "key x", "wait 3",
]
script = """
log skill points with the mod (task 4.4 of add-level-rework): the budget follows the level through the mod's own level-up
wait world
wait 15
inspect player [@0x7691C8]
expect cube::World.joined value u8 == 0 [@0x7691C8] + 0x390
trace args 1
trace add @0x4DCCDF
trace add @0x488EC0
# window A: level 9 with 90 XP written directly (no level-up call): the limit should read 2 * 9 - 2 = 16
inspect set data.mana_cubes 0
inspect set data.level 9
inspect set data.current_xp 90
trace start
log sp: A open
wait 70
trace stop
trace report
expect cube::GameController::toggleSkills calls @0x488EC0 >= 1
expect cube::SkillWidget::pointsLimitSite calls @0x4DCCDF >= 1
expect cube::SkillWidget::pointsLimitSite reg @0x4DCCDF eax == 16
log sp: A done
wait 12
# the kill: level 10, power_base 0, flags 0: the mod pays X(10) = 3 XP, so 90 + 3 = 93 and the level-up at 92 leaves 1
inspect creatures [@0x7691C8] + 0x2DC
inspect cube::Creature [[[[@0x7691C8] + 0x2E0] + 8] + 0x18]
inspect set data.hostile_type 1
inspect set data.level 10
inspect set data.power_base 0
inspect set data.appearance.flags 0
inspect set data.hp 1
inspect set data.armor_multiplier 0
inspect set data.stun_time 60000
inspect set data.pos.x from [[@0x7691C8] + 0x8006C8] + 0x10 plus 0x8000
inspect set data.pos.y from [[@0x7691C8] + 0x8006C8] + 0x18
inspect set data.pos.z from [[@0x7691C8] + 0x8006C8] + 0x20
inspect player [@0x7691C8]
inspect set data.level 9
inspect set data.current_xp 90
inspect set data.mp 1
log sp: kill at level 9 with 90 XP
inspect set data.damage_multiplier 100
inspect set data.current_mode 86
inspect set data.mode_start_time 0
wait 3
inspect set data.current_mode 0
inspect set data.mode_start_time 0
wait 1
inspect set data.current_mode 4
inspect set data.mode_start_time 0
wait 2
inspect player [@0x7691C8]
expect cube::CreatureData.level value i32 == 10 [[@0x7691C8] + 0x8006C8] + 0x190
expect cube::CreatureData.current_xp value i32 == 1 [[@0x7691C8] + 0x8006C8] + 0x194
# window B: level 10 from the mod's level-up: the limit should read 2 * 10 - 2 = 18, two more than at level 9
trace start
log sp: B open
wait 70
trace stop
trace report
expect cube::SkillWidget::pointsLimitSite calls @0x4DCCDF >= 1
expect cube::SkillWidget::pointsLimitSite reg @0x4DCCDF eax == 18
log sp: B done
wait 5
expect - hooks == 0
"""
