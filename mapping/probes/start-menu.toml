# Task 2.1 of add-mod-manager. Read statically first (REA on Ghidra, then objdump): the start menu is one widget that
# draws its three rows as text, so the four top-level `button` nodes of the title-scene record are not its buttons.
# The replay checks the layout under Wine at 1024 x 768: gamepilot's own Start Game point (511, 457) is inside the
# first row as computed from cube::GameController::onResize.
id = "start-menu"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1"
date = "2026-10-19"
steps = [
    "Read cube::StartMenuWidget's vtable, its draw (slot 1), cube::GameController::onMouseDown and onResize with REA (Ghidra) and objdump",
    "Replayed at the start menu under Wine: the cursor over each row and beside them, the hover index watched, then a click on Start Game",
]
observations = [
    "the title screen's Start Game, Options and Exit are text drawn by cube::StartMenuWidget::draw, not plasma button nodes; the four top-level button nodes are the clones Back, Multiplayer Worlds..., Connect to server and Connect",
    "the widget is 200 x 100 at ((window_width - 200) / 2, window_height / 2 + 50); its rows are hit-tested at y 10 to 40, 60 to 90 and 110 to 140 of the widget, over its whole width",
    "a left click acts on hover: 0 hides start_scene and shows character_select, 1 shows options_panel, 2 sets quit_requested; other values do nothing",
    "neither the draw nor the click path fires an interface event or a sound",
]

[[confirms]]
entry = "cube::GameController.window_width"
observed = "1024 under Wine, the gamepilot window's client width"

[[confirms]]
entry = "cube::GameController.window_height"
observed = "768 under Wine"

[[confirms]]
entry = "cube::GameController.start_menu"
observed = "points at an object whose vtable is cube::StartMenuWidget's (0x71909C)"

[[confirms]]
entry = "cube::StartMenuWidget.hover"
observed = "0, 1 and 2 with the cursor over the three rows at x 512, y 459, 509 and 559; -1 beside them"

[[confirms]]
entry = "cube::StartMenuWidget::draw"
observed = "called every frame at the start menu"

[[confirms]]
entry = "cube::StartMenuWidget::drawEndSite"
observed = "reached as often as the draw"

[[confirms]]
entry = "plasma::Display.visible_values"
observed = "start_scene's value 1 at the title screen and 0 after Start Game; character_select's the reverse"

[[confirms]]
entry = "cube::GameController.start_scene"
observed = "visible at the title screen, hidden after a click on Start Game"

[[confirms]]
entry = "cube::GameController.character_select"
observed = "hidden at the title screen, shown after a click on Start Game"

[[confirms]]
entry = "cube::GameController.quit_requested"
observed = "0 throughout (Exit is never clicked)"

[replay]
host = "Cube.exe"
setup = "menu"
seconds = 180
mods = []
input = [
    "until startmenu sweep",
    "move 300 459", "wait 4",
    "move 512 459", "wait 4", "shot 01-start",
    "move 512 509", "wait 4", "shot 02-options",
    "move 512 559", "wait 4", "shot 03-exit",
    "move 512 640", "wait 4",
    "until startmenu click",
    "move 511 457", "wait 2", "click 511 457", "wait 6", "shot 04-after-start",
]
script = """
log startmenu: task 2.1 of add-mod-manager
wait 15
expect cube::GameController.window_width value i32 == 1024 [@0x7691C8] + 0x11C
expect cube::GameController.window_height value i32 == 768 [@0x7691C8] + 0x120
expect cube::GameController.start_menu value u32 == 0x71909C [[@0x7691C8] + 0x800914]
# the visible words at key 0 (the key is checked first)
expect - value i32 == 0 [[[@0x7691C8] + 0x80086C] + 0x3C] + 0x68
expect cube::GameController.start_scene value i32 == 1 [[[[@0x7691C8] + 0x80086C] + 0x3C] + 0x94]
expect - value i32 == 0 [[[@0x7691C8] + 0x800880] + 0x3C] + 0x68
expect cube::GameController.character_select value i32 == 0 [[[[@0x7691C8] + 0x800880] + 0x3C] + 0x94]
trace add @0x582190
trace add @0x582965
trace start
watch hover i32 [[@0x7691C8] + 0x800914] + 0x160
log startmenu sweep
wait 30
trace stop
trace report
expect cube::StartMenuWidget::draw calls @0x582190 > 100
expect cube::StartMenuWidget::drawEndSite calls @0x582965 within 2 of @0x582190
expect cube::StartMenuWidget.hover watch hover reached 0
expect cube::StartMenuWidget.hover watch hover reached 1
expect cube::StartMenuWidget.hover watch hover reached 2
expect cube::StartMenuWidget.hover watch hover reached -1
watch clear
log startmenu click
wait 15
expect plasma::Display.visible_values value i32 == 0 [[[[@0x7691C8] + 0x80086C] + 0x3C] + 0x94]
expect plasma::Display.visible_values value i32 == 1 [[[[@0x7691C8] + 0x800880] + 0x3C] + 0x94]
expect cube::GameController.quit_requested value u8 == 0 [@0x7691C8] + 0x198
expect - hooks == 0
"""
