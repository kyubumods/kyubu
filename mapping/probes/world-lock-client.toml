# Recorded with kyubu_probe and the Kyubu loader of add-game-api (API 1.1, a MinGW build), unattended under Wine 9.0
# (WSL on the Windows laptop): kmap probe replay starts the probed Cube.exe, then a plain Kyubu-loaded Server.exe
# beside it (server = "local"); the Cube.exe joins 127.0.0.1 with a new character and walks.
# Static reading (Cube.exe): World+0x8000C0 is a critical section, set up and deleted as in Server.exe. 0x59ACD0
# enters it and 0x59E770 leaves it (this = the World; cube::WorldMap, at GameController+0x800D3C, has the same
# layout and uses them too). cube::GameController::update enters it at 0x48927F and leaves it at its end, so the
# whole update, cube::World::update included, runs under it; render and the input handlers take it on the main
# thread too. The GameController constructor starts three threads, whatever the mode: zone_loader_step (which also
# enters it directly, with the one at +0x8000D8, in 0x5A30A0, 0x5A3120 and 0x5A31B0), 0x469B80 (briefly, to read
# the controller) and 0x469500 (which spins on the cube::WorldMap's). client_connect starts client_receive_loop (packet 2 each server tick; packet 0 finds
# and writes creatures under it) and client_send_loop.
id = "world-lock-client"
build = "cube-0x51D2CE9C"
kyubu = "1.0.1 (API 1.1)"
date = "2026-09-28"
steps = [
    "Wine replay: Cube.exe with --kyubu-dev beside a plain Server.exe; joined 127.0.0.1 with a new character",
    "Traced the lock 0x59ACD0, the unlock 0x59E770 and the zone loader's EnterCriticalSection calls",
    "Traced from the join: 40 s while the world loaded, then 120 s walking; tallied every call by caller, this, thread",
]
observations = [
    "Wine replay 2 passed, 11 of 11 held; replay 1 (traced from 40 s after the join) saw no zone loader activity",
    "main thread (36): cube::GameController::update and render, 1,431 frames each, this = the World (0x044202FC)",
    "receive thread (428): 97,101 creature updates (packet 0), each locking twice (0x46C041, 0x46C123), and 6,460",
    "per-tick packets (2, 4, 5); send thread (432): 14,264 passes; thread 0x469B80 (372): 1,283 times",
    "zone loader (380): 59 direct entries, argument 0x04C203BC = World + 0x8000C0 (9 in 0x5A30A0, 9 in 0x5A3120,",
    "41 in 0x5A31B0, from 0.3 s after the join), and once through 0x59ACD0 from zone_loader_step (0x46B3E9)",
    "thread 0x469500 (376) calls 0x59ACD0 8.5 million times on the cube::WorldMap (GameController+0x800D3C), never",
    "on the World; the spin count at World+0x8000D4 is 1024",
]

[[confirms]]
entry = "cube::World.lock"
observed = "a joined Cube.exe: the main thread around the whole update, the receive, send, zone and 0x469B80 threads lock it"

[replay]
host = "Cube.exe"
setup = "menu"
server = "local"
seconds = 360
input = [
    "shot 01-joined",
    "until 2.2: walk",
    "hold s 120", "shot 02-walked",
]
script = """
log World lock (add-game-api 2.2): which threads take World+0x8000C0 on a joined Cube.exe
trace add @0x59ACD0
trace add @0x59E770
trace add @0x5A30EB
trace add @0x5A3173
trace add @0x5A3259
wait world
# from the join on: the zone loader adds the zones around the player while the client loads
trace start
wait 40
log 2.2: walk
wait 120
trace stop
trace report
# the main thread: cube::GameController::update (around the whole update) and render
expect cube::World.lock from @0x59ACD0 0x489284 this [cube::game_controller] + 0x2DC
expect cube::World.lock from @0x59E770 0x49D4AF this [cube::game_controller] + 0x2DC
expect cube::World.lock from @0x59ACD0 0x4AC363 this [cube::game_controller] + 0x2DC
# the receive thread: packet 2 (each server tick) and packet 0 (creature updates)
expect cube::World.lock from @0x59ACD0 0x46BCDA this [cube::game_controller] + 0x2DC
expect cube::World.lock from @0x59ACD0 0x46C041 this [cube::game_controller] + 0x2DC
# the send thread
expect cube::World.lock from @0x59ACD0 0x46A14F this [cube::game_controller] + 0x2DC
# the constructor's thread 0x469B80
expect cube::World.lock from @0x59ACD0 0x469E6D this [cube::game_controller] + 0x2DC
# the main thread, the receive and send threads and 0x469B80 at least
expect cube::World.lock threads @0x59ACD0 >= 4 this [cube::game_controller] + 0x2DC
# zone_loader_step's own lock entries: a mid hook on the `call EnterCriticalSection` of 0x5A30A0, 0x5A3120 and
# 0x5A31B0 (which only it calls), where the first stack word is the argument, &World.lock
expect cube::World.lock from @0x5A30EB,@0x5A3173,@0x5A3259 [cube::game_controller]+0x2DC+0x8000C0
# the constructor's spin count (0x80000400 without the flag bit) at +0x14: a critical section
expect cube::World.lock value u32 == 1024 [cube::game_controller] + 0x2DC + 0x8000D4
expect - hooks == 0
"""
