[[function]]
name = "server_accept_loop"
address = 0x425290
convention = "fastcall"
subsystem = "network"
status = "candidate"
evidence = ["import:ws2_32.dll!accept", "string:\"Waiting for connection.\""]
source = "kyubu"
notes = "thread: accept, read the client's packet id (17) and version, print it, refuse full or wrong-version clients, send the join, build a cube::Creature and a cube::Connection, start its receive loop. A version other than 3 (compare at 0x42554E) gets a bare 3, not 17 (static, see probe:protocol-version)"

[[function]]
name = "connection_receive_loop"
address = 0x425E10
convention = "fastcall"
subsystem = "network"
status = "candidate"
evidence = ["import:ws2_32.dll!recv", "cuwo:cuwo/packet.py"]
source = "kyubu"
notes = "thread per client: switches on 0 and 6-12, cuwo's client-to-server packets; 0 merges the client's creature data, 7-9 queue hits, passives and shots, 10 sends the chat to every connection"

[[function]]
name = "connection_send_loop"
address = 0x423BC0
convention = "thiscall"
subsystem = "network"
status = "verified"
evidence = ["import:ws2_32.dll!send", "xref:server_accept_loop", "manual:body of a std::function lambda; slot 2 of vtable 0x55B220 jumps here"]
source = "kyubu"
aliases = ["Server::simLoop"]
notes = "resolved in 7.5, formerly sim_loop: a thread per client, not the simulation. While its connection is open it locks the World, collects changes, unlocks, sends them to that client's socket, then paces to 20 ms"

[[function]]
name = "connection_send_pass_site"
