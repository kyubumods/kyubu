[[function]]
name = "creature_update_read"
address = 0x415810
convention = "cdecl"
subsystem = "network"
status = "candidate"
evidence = ["xref:connection_receive_loop", "cuwo:cuwo/entity.pyx"]
source = "kyubu"
notes = "packet 0 on the server: reads the mask and each masked field into a copy of the player's creature data, spare fields included (data+0x144, 0x17C, 0x17D, 0x19C, 0x1CC...)"

[[function]]
name = "Net::acceptVersionSite"
address = 0x42554E
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:server_accept_loop", "manual:cmp dword [ebp-0x1BC],3; je", "probe:server-level-sites"]
source = "kyubu"
notes = "in server_accept_loop: the client's version against 3. The 3 is an imm8 (83 BD 44 FE FF FF 03): 0x4B4C0001 does not fit, so D7's byte patch is impossible here; 8.3 needs a mid hook. A wrong version gets the bare reply below."

[[function]]
name = "Net::acceptWrongVersionReplySite"
address = 0x42555F
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:server_accept_loop", "manual:mov dword [ebp-0x198],3, send, Sleep 500, close", "probe:server-level-sites"]
source = "kyubu"
notes = "the refusal of a wrong version: sends a 4-byte 3 (imm32 at 0x425565), waits 500 ms, closes. Vanilla never sends the 17 the client's version text belongs to; the mod (task 8.3) patches it to 17 and sends 8 bytes, so probes trace 0x42556E."

[[function]]
name = "Net::acceptJoinSite"
address = 0x4255AC
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:server_accept_loop", "manual:je target at 0x425555: the join reply"]
source = "kyubu"
notes = "in server_accept_loop: the join. Reached when the client's version equals 3 (task 8.3: the mod's hook at 0x42554E turns the mod's version into 3 and vanilla's 3 into 0, so only a modded client gets here on a modded server). Sends the 4-byte 0x10 reply."

[[function]]
name = "creature_update_level_site"
address = 0x415B05
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:creature_update_read", "manual:the call at 0x415B00 reads data+0x180", "probe:server-protocol-modded"]
source = "kyubu"
notes = "in creature_update_read: the call at 0x415B00 reads the level (data+0x180) into the copy of the player's data, ESI. This is the next instruction: the level check (D7) goes here. Corrected 2026-10-04 (task 8.3) from 0x415B47, which follows the read of a different field (+0x190)."
