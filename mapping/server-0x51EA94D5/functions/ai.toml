notes = "once per candidate in the scan for a first target: EBX the candidate, XMM2 its squared distance (divided by the stealth factor), XMM4 the squared radius. A huge XMM2 here keeps that creature out of the scan (the Ninja's true stealth on the server). Cube.exe twin 0x42D0EE"

