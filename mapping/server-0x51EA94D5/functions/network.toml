[[function]]
name = "server_accept_loop"
address = 0x4254A0
convention = "fastcall"
subsystem = "network"
status = "candidate"
evidence = ["import:ws2_32.dll!accept", "string:\"Waiting for connection.\"", "correlated:server-0x51D2CE9B:server_accept_loop"]
source = "kyubu"
notes = "thread: accept, read the client's packet id (17) and version, print it, refuse full or wrong-version clients, send the join, build a cube::Creature and a cube::Connection, start its receive loop. A version other than 3 (compare at 0x42575E) gets a bare 3, not 17 (static, see probe:protocol-version)"

