[[function]]
name = "Net::acceptVersionSite"
address = 0x42575E
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:server_accept_loop", "manual:cmp dword [ebp-0x1BC],3; je", "correlated:server-0x51D2CE9B:Net::acceptVersionSite"]
source = "kyubu"
notes = "in server_accept_loop: the client's version against 3. The 3 is an imm8 (83 BD 44 FE FF FF 03): 0x4B4C0001 does not fit, so D7's byte patch is impossible here; 8.3 needs a mid hook. A wrong version gets the bare reply below."

[[function]]
name = "Net::acceptWrongVersionReplySite"
address = 0x42576F
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:server_accept_loop", "manual:mov dword [ebp-0x198],3, send, Sleep 500, close", "correlated:server-0x51D2CE9B:Net::acceptWrongVersionReplySite"]
source = "kyubu"
notes = "the refusal of a wrong version: sends a 4-byte 3 (imm32 at 0x425775), waits 500 ms, closes. Vanilla never sends the 17 the client's version text belongs to; the mod (task 8.3) patches it to 17 and sends 8 bytes, so probes trace 0x42577E."

[[function]]
name = "Net::acceptJoinSite"
address = 0x4257BC
convention = "cdecl"
kind = "site"
subsystem = "network"
status = "candidate"
evidence = ["xref:server_accept_loop", "manual:je target at 0x425765: the join reply", "correlated:server-0x51D2CE9B:Net::acceptJoinSite", "manual:placed in 07-20 by aligned instructions; the code nearby changed"]
source = "kyubu"
notes = "in server_accept_loop: the join. Reached when the client's version equals 3 (task 8.3: the mod's hook at 0x42575E turns the mod's version into 3 and vanilla's 3 into 0, so only a modded client gets here on a modded server). Sends the 4-byte 0x10 reply."

