status = "candidate"
evidence = ["import:ws2_32.dll!recv", "cuwo:cuwo/packet.py", "correlated:server-0x51D2CE9B:connection_receive_loop"]
source = "kyubu"
notes = "thread per client: switches on 0 and 6-12, cuwo's client-to-server packets; 0 merges the client's creature data, 7-9 queue hits, passives and shots, 10 sends the chat to every connection"

