# Task 10.9a of add-skills-unleashed-multiplayer (design D16): a joined player's projectile (packet 9). The receive thread
# queues it on cube::Server's list (Server+0x44, a std::list of 0x70-byte cube::Projectile, nodes 0x78); the main loop hands
# the list to the step output after cube::World::update. Nothing pushes it into cube::World.projectiles: the server relays a
# player's arrow and does not fly it.

[[function]]
name = "Net::receiveProjectileSite"
address = 0x4265B3
convention = "cdecl"
kind = "site"
sig_len = 9
subsystem = "network"
status = "verified"
evidence = ["xref:connection_receive_loop", "manual:case 9 (0x426560): receives 0x70 bytes, locks, push_back on [EDI+0x20]", "probe:server-projectile-packet-0720"]
source = "kyubu"
notes = "packet 9 on the connection's thread, World lock held, before the push on the Server's list: EBP-0x110 the cube::Projectile the client sent; EDI the closure (+4 the connections, +8 the slot, +0x20 the list, cube::Server+0x44)"

