# Regions, their missions and dungeons, and where creature levels come from (read statically on 2026-09-30).

[[function]]
name = "region_generate"
address = 0x50E080
convention = "thiscall"
subsystem = "world"
status = "candidate"
evidence = ["xref:cube::Region::Region", "manual:builds a region's 64 missions (areas) and its zone tiles", "correlated:server-0x51D2CE9B:region_generate"]
source = "kyubu"
notes = "a counter i runs 0-63 over the sorted missions (Region+0x14018, 0x68 each); only EVEN i get an area level from level_from_power_fraction(i/64); (i>>1) odd is a dungeon (zone tile kind 3). Each rolls a +N (0-4) from its vanilla level. Corrected 2026-10-03 (Cube.exe twin 0x5DA280)"

[[function]]
name = "level_from_power_fraction"
address = 0x411090
convention = "cdecl"
prototype = "float __cdecl level_from_power_fraction(float fraction)"
subsystem = "world"
status = "candidate"
evidence = ["manual:returns (1/(1 - fraction) - 1)*20 + 1, the inverse of level_curve", "xref:region_generate", "correlated:server-0x51D2CE9B:level_from_power_fraction"]
source = "kyubu"
notes = "fraction p gives the level whose power is about 1 + 100p. Other callers 0x414470, 0x4FC180, 0x4FD920 and 0x4FDE90 (not read; probably item generation), so a mod should change the area-level call site (0x50EAA4), not this helper"

