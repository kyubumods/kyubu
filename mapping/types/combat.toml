# One hit (task 9.5): cuwo's hit packet (packet 7), the same 0x48 bytes the game keeps in a std::list per World step.

[[type]]
name = "cube::Hit"
kind = "struct"
size = 0x48
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::applyHit", "xref:cube::World::hitCreature", "manual:hitCreature fills one at ESP+0xC4, last byte written +0x46"]
source = "cuwo"
notes = "built by cube::World::hitCreature, applied by cube::World::applyHit; the step output's hit list holds 0x50-byte nodes (0x486760 pushes one), which a joined client sends to the server"

[[type.field]]
offset = 0x0
name = "entity_id"
type = "uint64_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py"]
source = "cuwo"
notes = "the attacker's creature id (cuwo's name)"

[[type.field]]
offset = 0x8
name = "target_id"
type = "uint64_t"
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "probe:server-guardian-0720"]
source = "cuwo"
notes = "the target's creature id: cube::World::applyHit looks it up first"

[[type.field]]
offset = 0x10
name = "damage"
type = "float"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::applyHit"]
source = "cuwo"
notes = "subtracted from the target's hp; negative heals"

[[type.field]]
offset = 0x14
name = "critical"
type = "uint8_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py"]
source = "cuwo"

[[type.field]]
offset = 0x18
name = "stun_duration"
type = "int32_t"
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::applyHit", "manual:hitCreature stores 0 or the target max stun at Hit+0x18"]
source = "cuwo"
notes = "ms; the target's data.stun_time becomes at least this, and its velocity is zeroed"

[[type.field]]
offset = 0x1C
name = "slow_duration"
type = "int32_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::applyHit"]
source = "cuwo"
notes = "ms; the target's data.slowed_time becomes at least this (cuwo calls it something8)"

[[type.field]]
offset = 0x20
name = "pos"
type = "cube::LongVector3"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py"]
source = "cuwo"

[[type.field]]
offset = 0x38
name = "hit_dir"
type = "cube::FloatVector3"
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::applyHit", "manual:hitCreature stores its direction argument at Hit+0x38"]
source = "cuwo"
notes = "the knockback: it replaces the target's data.extra_vel when longer (a tenth while stunned)"

[[type.field]]
offset = 0x44
name = "skill_hit"
type = "uint8_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py"]
source = "cuwo"

[[type.field]]
offset = 0x45
name = "hit_type"
type = "uint8_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::applyHit"]
source = "cuwo"
notes = "1 adds 0.25 to the target's mp, 3 does nothing, 4 calls 0x43D7B0 on the target, 5 hits its shields first"

[[type.field]]
offset = 0x46
name = "show_light"
type = "uint8_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py"]
source = "cuwo"

# One projectile (task 9.6): cuwo's shoot packet, the same 0x70 bytes the World keeps in cube::World.projectiles and
# the step output in its shoot list. Only the fields the spawn (0x616303) and the update (0x61F31D) use are mapped.

[[type]]
name = "cube::Projectile"
kind = "struct"
size = 0x70
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileSpawnSite", "xref:cube::World::projectileUpdateSite", "probe:projectile-spawn"]
source = "cuwo"
notes = "cuwo's ShootPacket. The size is also the list's: 0x486670 caps it at 0x2222221 nodes of 0x78 bytes. Built on the stack by the projectile block of the dispatch and copied into both lists"

[[type.field]]
offset = 0x0
name = "entity_id"
type = "uint64_t"
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileSpawnSite", "probe:projectile-spawn"]
source = "cuwo"
notes = "the shooter's creature id (copied from cube::Creature.id); a boomerang looks its shooter up by it"

[[type.field]]
offset = 0x18
name = "pos"
type = "cube::LongVector3"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileSpawnSite"]
source = "cuwo"
notes = "starts at the shooter's data.pos; the World step adds velocity * dt"

[[type.field]]
offset = 0x3C
name = "velocity"
type = "cube::FloatVector3"
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileSpawnSite", "probe:projectile-spawn"]
source = "cuwo"
notes = "blocks per second: the shooter's data.ray_hit normalised (0x4279D0) times 50, or 100 with Creature+0xAA9 = 12"

[[type.field]]
offset = 0x48
name = "damage"
type = "float"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::Creature::modeDamageFactor"]
source = "cuwo"
notes = "cuwo's legacy_damage: modeDamageFactor(mode) * 0x4474D0() * a random 0.75 to 1.25; for 108, 0x43E4F0() instead of 0x4474D0() and times 5"

[[type.field]]
offset = 0x50
name = "scale"
type = "float"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileSpawnSite"]
source = "cuwo"
notes = "charged_mp + 0.5 for 38-42 and 44, + 1 for 45 and 46, + 1.5 for 37 and 43; 4 for 108"

[[type.field]]
offset = 0x54
name = "mana"
type = "float"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileSpawnSite"]
source = "cuwo"
notes = "the shooter's data.charged_mp for 38-42 and 44; 1 for 37, 43 and 108; 0.25 for 45 and 46"

[[type.field]]
offset = 0x5C
name = "skill"
type = "uint8_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileSpawnSite"]
source = "cuwo"
notes = "1 for 37, 43, 45, 46 and 108; passed on to cube::World::hitCreature"

[[type.field]]
offset = 0x60
name = "kind"
type = "int32_t"
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::projectileUpdateSite", "probe:projectile-spawn"]
source = "kyubu"
notes = "cuwo's projectile. The spawn sets 1 for 37-46 and 4 for 108. The update: 1 flies straight, 2 returns to its shooter (a boomerang), 0, 3 and 4 fall. 0, 1 and 4 stop at the first creature they meet (with skill set, 1 and 4 then explode and hit through 0x621305); 2 and 3 go on"

[[type.field]]
offset = 0x64
name = "heals"
type = "uint8_t"
status = "candidate"
evidence = ["xref:cube::World::projectileUpdateSite"]
source = "kyubu"
notes = "cuwo's something26. 2: the projectile applies a hit with negated damage (a heal) to the creatures it passes, through applyHit at 0x620664; otherwise hits go through cube::World::hitCreature (0x6206DC). The spawn sets 1 or 2 only when Creature+0x140 is 3"

[[type.field]]
offset = 0x68
name = "age"
type = "int32_t"
status = "verified"
evidence = ["xref:cube::World::projectileUpdateSite", "probe:projectile-spawn"]
source = "kyubu"
notes = "ms since the shot (cuwo's something27): 0 at the spawn, + dt each step; past 5000 the projectile is removed"

