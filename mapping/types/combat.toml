# The ability (mode) ids of cube::CreatureData.current_mode, from Cube.exe (task 9.2). cube::Creature::modeDuration
# (0x43DA30) switches on every id from 0 to 105; the dispatch in cube::World::update (task 9.3) has cases up to 110,
# so the range is 0 to 110 (106 to 110 are MODE_<id>, added with the user's approval). Names come from the game's strings:
# the cast bar in cube::GameController::update (a switch on current_mode - 30 at 0x49340C, table 0x49D5A0, which
# shows the spell name) and the skill tooltips (the @ placeholders that skill_description_fill fills per id).
# Ids the game names nowhere are MODE_<id>. All 16 names cuwo gives (cuwo/strings.py) match these values.

[[enum]]
name = "cube::AbilityId"
size = 1
subsystem = "combat"
status = "verified"
evidence = ["xref:cube::Creature::modeDuration", "xref:cube::World::abilityDispatchSite", "probe:ability-force", "cuwo:cuwo/strings.py"]
source = "kyubu"
notes = "the value of cube::CreatureData.current_mode; 0 to 110 (modeDuration covers 0 to 105, the dispatch in cube::World::update up to 110), named from the cast bar and the skill tooltips; the MODE_<id> names are placeholders until the game's use of the id is known"

