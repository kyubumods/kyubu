[[type.field]]
offset = 0xBC
name = "regions"
type = "cube::Region*[1048576]"
status = "verified"
evidence = ["manual:Cube 0x434A90 and Server 0x406210 read +0xBC + 4*(x*1024+y)", "xref:cube::World::getBlock", "probe:world-block-client", "probe:world-block-server"]
source = "kyubu"
notes = "the loaded regions by region x and y (0 to 1023, index x*1024 + y), null where none. A region is 64 by 64 zones. The zone thread fills and empties it; its slot is cleared while the thread holds cube::World.lock, so a read under the lock sees a live region or null"

[[type.field]]
offset = 0x8000C0
name = "lock"
type = "win32::CriticalSection"
status = "verified"
evidence = ["manual:0x4D3D50 (Server), 0x59ACD0 (Cube) enter it; the constructors set it up", "xref:cube::GameController::update", "probe:world-lock-server", "probe:world-lock-client", "probe:world-lock"]
source = "kyubu"
notes = "the World's lock. The game thread holds it around cube::World::update (Server.exe's main; all of Cube.exe's GameController::update). The zone thread, Cube.exe's 0x469B80 and each client's receive and send threads take it too, single-player included. Another critical section follows at +0x8000D8"

