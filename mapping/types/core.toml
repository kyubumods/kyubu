kind = "class"
size = 0x80029C
status = "verified"
evidence = ["probe:game-access-client", "probe:game-access-server"]
source = "kyubu"
notes = "the same size in both builds: Server.exe allocates it with operator new(0x80029C); in Cube.exe it is embedded in the controller and ends before the next member. Its RTTI vtable is at +0"

