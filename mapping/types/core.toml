notes = "every live creature by id: the key is a uint64 id at node+0x10, the value the cube::Creature* at node+0x18. The controller's constructor inserts the player under id 1. Run-time ids (pets, bombs, summons) are min(0, lowest id in the map) - 1 as signed 64-bit: -1, -2, ..."

