# The objects everything else hangs from, and the members that lead from one to the next (task 7.2), then the
# local player's creature and the creature collection (task 7.3). Only the access paths are mapped here; the rest of
# each object is still unknown bytes. Checked in the running game by the probes game-access-client (Cube.exe),
# game-access-server (Server.exe) and creature-collection.

[[type]]
