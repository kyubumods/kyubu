[[enum]]
name = "cube::HostileType"
size = 1
status = "verified"
evidence = ["cuwo:cuwo/constants.py", "probe:hostile-types"]
subsystem = "creatures"
source = "cuwo"
notes = "probe hostile-types: a player can hit 1 and 6 but not 2 and 3 (slimes, level 1); tags: 1 red hp bar, 2 and 3 blue, 6 grey; 3 gets game-made names and a talk prompt; cuwo's names kept; PET (5) is not in cuwo but is what the game's pet spawn writes, beside the owner's id (atlas ai)"

