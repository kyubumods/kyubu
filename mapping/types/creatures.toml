# The entity types of cube::CreatureData.entity_type, from Cube.exe (task 3.3 of add-entity-spawner). The names and values
# were imported from cuwo (cuwo/strings.py: 154 names for 0 to 155); creature_appearance_for_type (0x43FDB0) switches on
# every value from 0 to 155, so cuwo lacks two names, 95 and 129, which the game draws. Moved here from
# cuwo-constants.toml, which `kmap import-cuwo` now leaves it out of (like cube::AbilityId in combat.toml). The status
# stays candidate until the user has seen the table of probe entity-types.

[[enum]]
name = "cube::EntityType"
size = 4
status = "verified"
evidence = ["cuwo:cuwo/strings.py", "probe:entity-types"]
subsystem = "creatures"
source = "cuwo"
