# plasma's scene tree and its Direct3D 9 drawing, from Cube.exe: the part the title screen and every HUD shape go
# through. Read in the draw call, the buffer upload and render_init, and followed in the running game from the
# controller's node pointers (probe title-scene). Offsets not listed are not read yet.

[[type]]
name = "plasma::Node"
kind = "class"
size = 0
builds = ["cube-0x51D2CE9C", "cube-0x51EA955E"]
status = "verified"
evidence = ["rtti:plasma::Node", "probe:title-scene"]
source = "kyubu"
notes = "a scene-tree node of a .plx: a name, a parent, children, a display and (by the name) the widget that was set on it. Bases plasma::NamedObject, plasma::Object; the vtable is at +0. The tree under the engine's root holds the HUD, every menu panel and the start scene"

[[type.field]]
offset = 0x0C
name = "name"
type = "std::wstring"
status = "verified"
evidence = ["probe:title-scene", "xref:plasma::set_node_widget"]
source = "kyubu"
notes = "the node's name as a std::wstring (MSVC 2012: 16-byte buffer, size at +0x1C, capacity at +0x20): up to 7 characters sit in the buffer, longer names behind the pointer in its first word. Unnamed nodes have an empty name; names repeat (every letter layer of the logo has its own C, U, B ...)"

[[type.field]]
offset = 0x28
name = "parent"
type = "plasma::Node*"
status = "verified"
evidence = ["probe:title-scene"]
source = "kyubu"
notes = "null for the engine's root. Walking it from any named node of the HUD or the start scene ends at the node named root"

[[type.field]]
offset = 0x2C
name = "children"
type = "std::list"
status = "verified"
evidence = ["probe:title-scene", "xref:plasma::set_node_widget"]
source = "kyubu"
notes = "embedded std::list<plasma::Node*>: head at +0x2C, count at +0x30. A list node is {next, prev, Node*}. The order is the .plx's, and the order the shapes are drawn in"

[[type.field]]
offset = 0x3C
name = "display"
type = "plasma::Display*"
status = "verified"
evidence = ["probe:title-scene", "xref:plasma::D3D9Drawing::draw"]
source = "kyubu"
notes = "the node's plasma::Display: its colour and mask settings. plasma::D3D9Drawing::draw reads the colour and the flags of it on every call"

[[type.field]]
offset = 0x38
name = "transformation"
type = "void*"
status = "candidate"
evidence = ["xref:cube::GameController::onResize"]
source = "kyubu"
notes = "the node's plasma::Transformation. Its position is keyed like plasma::Display.visible_values: x and y floats at [+0x94] + [+0x68] * 8, minus a pivot read at [+0x19C] + [+0x170] * 8; after a write the game calls the transformation's vtable slot 1 with 1"

[[type.field]]
offset = 0x40
name = "widget"
type = "plasma::Widget*"
status = "candidate"
evidence = ["xref:cube::GameController::onResize"]
source = "kyubu"
notes = "the widget on the node, if any: onResize reads cube::GameController.start_menu_node + 0x40 to place the start menu"

[[type]]
name = "plasma::Display"
kind = "class"
size = 0
builds = ["cube-0x51D2CE9C", "cube-0x51EA955E"]
status = "verified"
evidence = ["rtti:plasma::Display", "probe:title-scene"]
source = "kyubu"
notes = "the part of a node that says how it is coloured and masked. The game's animation attributes (plasma::ContinuousAttribute and others) live in it, so it is large (at least 0x204 bytes)"

[[type.field]]
offset = 0x68
name = "key"
type = "int32_t"
status = "candidate"
evidence = ["xref:cube::GameController::update", "xref:cube::GameController::onMouseDown"]
source = "kyubu"
notes = "the index of the attribute value in use; the game reads and writes visible_values at this index"

[[type.field]]
offset = 0x94
name = "visible_values"
type = "int32_t*"
status = "candidate"
evidence = ["xref:cube::GameController::update", "xref:cube::GameController::onMouseDown"]
source = "kyubu"
notes = "the node's visibility: [visible_values + key * 4] is 1 when the node is shown and 0 when hidden. The game shows and hides its panels by writing this word (Start Game writes 0 to start_scene's and 1 to character_select's); 0x411C80 (node, bool) does the same for a node"

[[type.field]]
offset = 0x118
name = "colour_index"
type = "uint32_t"
status = "verified"
evidence = ["probe:title-scene", "xref:plasma::D3D9Drawing::draw"]
source = "kyubu"
notes = "the row of colour_table that the draw call uses; 0 for every node of the logo"

[[type.field]]
offset = 0x144
name = "colour_table"
type = "float*"
status = "verified"
evidence = ["probe:title-scene", "xref:plasma::D3D9Drawing::draw"]
source = "kyubu"
notes = "rows of 4 floats, RGBA. The draw call multiplies row colour_index by the colour its caller passes and gives that to the vertex shader as the shape's colour, so a node fades by its alpha here"

[[type.field]]
offset = 0x200
name = "flags"
type = "uint32_t"
status = "candidate"
evidence = ["xref:plasma::D3D9Drawing::draw"]
source = "kyubu"
notes = "read by draw: bit 0, the node uses a mask or texture; bit 1, the mask is multiplied; otherwise bit 2 picks the mask's alpha only (set) or its colour over the shape (clear). These become the pixel shader's filter value 2, 3 or 1"

