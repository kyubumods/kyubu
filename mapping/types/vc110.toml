# The VC110 (Visual C++ 2012) standard-library layouts both builds use, x86, release (no iterator debugging, so no
# proxy pointer, and stateless allocators take no space). Checked against live Cube.exe objects in probe
# vc110-layouts (task 7.1). A container's element type is not part of these types: the element follows the node
# header (std::list_node at +8, std::tree_node at +0x10, aligned to the element).

[[type]]
name = "std::string_storage"
kind = "union"
size = 0x10
status = "verified"
evidence = ["probe:vc110-layouts"]
source = "kyubu"
notes = "the characters themselves while capacity < 16 (small-string buffer), else a pointer to them"

[[type.field]]
offset = 0x0
name = "buf"
type = "char[16]"
status = "verified"
evidence = ["probe:vc110-layouts"]
source = "kyubu"
notes = "used while capacity is 15: \"--kyubu-dev\" (size 11) sat here"

[[type.field]]
offset = 0x0
name = "ptr"
type = "char*"
status = "verified"
evidence = ["probe:vc110-layouts"]
source = "kyubu"
notes = "used once capacity is 16 or more: model file names (size 21, capacity 21) on the heap"

