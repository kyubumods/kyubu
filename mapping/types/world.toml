# World-generation records that carry levels: the region's missions (areas), the zone's copy of its tile, and the
# spawn record a creature is built from. Read statically in Server.exe on 2026-09-30 for the level-rework design
# (see the world and creatures atlas pages); Cube.exe's twins are not checked yet, hence builds = Server.exe.

[[type]]
name = "cube::MissionData"
kind = "struct"
size = 0x68
builds = ["server-0x51D2CE9B", "server-0x51EA94D5"]
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "manual:mission_at steps 0x68 bytes through Region+0x14018 (8 x 8 records)"]
source = "cuwo"
notes = "cuwo's name for a region's area record. region_generate fills 64 per region; the level and +N fields below drive spawn levels, dungeon levels and power_base"

[[type.field]]
offset = 0x0
name = "origin_x"
type = "uint64_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd"]
source = "cuwo"

[[type.field]]
offset = 0x8
name = "origin_y"
type = "uint64_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd"]
source = "cuwo"

[[type.field]]
offset = 0x10
name = "size"
type = "float"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "manual:region_generate stores 128.0f and 150.0f here and reads it as a float"]
source = "cuwo"
notes = "the area's radius, in blocks. cuwo types it as an integer, but the game stores floats (128, 150). mission_influence treats a size below 0.001 as no area"

[[type.field]]
offset = 0x18
name = "place_category_id"
type = "uint32_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "xref:region_generate"]
source = "cuwo"
notes = "region_generate writes kinds 2 to 7, 11, 12, 14 (and 15 in one case); mission_influence special-cases 11 to 14"

[[type.field]]
offset = 0x24
name = "area_level"
type = "uint32_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "xref:region_generate"]
source = "cuwo"
notes = "int(level_from_power_fraction(rank/64)) for the mission's rank in its region: vanilla levels 1 to 1261, even steps in power 1 to 99. Dungeon tiles and spawn_level_from_mission copy it"

[[type.field]]
offset = 0x28
name = "dword28"
type = "uint32_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "xref:region_generate"]
source = "cuwo"
notes = "the area's +N (power_base for its monsters), rolled from area_level: below 5 gives 0, 5-9 gives 0-1, 10-14 gives 0-2, 15-18 gives 1-3, from 19 gives 1-4. cuwo only names it by offset"

[[type]]
name = "cube::Zone"
kind = "class"
size = 0
builds = ["cube-0x51EA955E", "server-0x51D2CE9B", "server-0x51EA94D5"]
status = "verified"
evidence = ["rtti:cube::Zone", "xref:cube::World::getBlock"]
source = "kyubu"
notes = "the level fields and the block columns are mapped. generateZone copies 16 bytes of the zone's region tile (tile+0x18 to +0x27) to +0x78 to +0x87 (0x51A721 to 0x51A740)"

[[type.field]]
offset = 0x78
name = "tile_kind"
type = "uint8_t"
status = "candidate"
evidence = ["manual:copied from the region tile; 3 marks a dungeon", "xref:dungeon_generate"]
source = "kyubu"
notes = "generateZone runs dungeon_generate for kinds 3 and 5"

[[type.field]]
offset = 0x79
name = "tile_style"
type = "uint8_t"
status = "candidate"
evidence = ["manual:copied from the region tile; rand & 3 for dungeons", "xref:region_generate"]
source = "kyubu"
notes = "passed to dungeon_generate as the dungeon kind; the entrance models are crypt, barrow, mine, antique and tomb"

[[type.field]]
offset = 0x80
name = "level"
type = "int32_t"
status = "candidate"
evidence = ["manual:1 from cube::Zone::Zone, then the region tile's level", "xref:dungeon_generate"]
source = "kyubu"
notes = "the mission's area_level for dungeon tiles; every dungeon monster and chest gets it"

[[type.field]]
offset = 0x84
name = "power_base"
type = "uint8_t"
status = "candidate"
evidence = ["manual:0 from cube::Zone::Zone, then the region tile's +N", "xref:dungeon_generate"]
source = "kyubu"
notes = "the dungeon's +N (0-4), copied into each dungeon monster's power_base; rolled by region_generate from the vanilla area level"

[[type.field]]
offset = 0xA8
name = "fields"
type = "cube::Field*"
status = "verified"
evidence = ["manual:Cube 0x4347A0 and Server 0x406100 index it (y%256*256 + x%256)", "xref:cube::World::getBlock", "probe:world-block-client", "probe:world-block-server"]
source = "kyubu"
notes = "the zone's 256 by 256 block columns, 0x20 bytes each, column (x % 256) + 256 * (y % 256) of the zone. The zone thread builds the zone and its columns before it puts the zone into its region slot"

[[type]]
name = "cube::Region"
kind = "class"
size = 0x15A28
builds = ["cube-0x51EA955E", "server-0x51EA94D5"]
status = "verified"
evidence = ["rtti:cube::Region", "manual:operator new(88616) in region_generate's caller"]
source = "kyubu"
notes = "64 by 64 zones and their landscape. Only the zone slots are mapped here (the missions are cube::MissionData)"

[[type.field]]
offset = 0x10018
name = "zones"
type = "cube::Zone*[4096]"
status = "verified"
evidence = ["manual:Cube 0x434D10 and Server 0x406290 read +0x10018 + 4*(x%64*64+y%64)", "xref:cube::World::getBlock", "probe:world-block-client", "probe:world-block-server"]
source = "kyubu"
notes = "the loaded zones by zone x and y within the region, index (x % 64) * 64 + y % 64, null where none. A zone enters its slot only when it is fully built; the slot is cleared under cube::World.lock before the zone is deleted"

[[type]]
name = "cube::Field"
kind = "class"
size = 0x20
builds = ["cube-0x51EA955E", "server-0x51EA94D5"]
status = "verified"
evidence = ["manual:getField returns cube::Zone.fields + 0x20 * column", "xref:cube::World::getBlock"]
source = "kyubu"
notes = "one block column of a zone: blocks from base_z up, size of them. Below base_z the game answers a solid block; above the column, water at z 0 and below, else air"

[[type.field]]
offset = 0x10
name = "base_z"
type = "int32_t"
status = "verified"
evidence = ["manual:getBlock compares z with +0x10 and indexes from it", "xref:cube::World::getBlock", "probe:world-block-client", "probe:world-block-server"]
source = "kyubu"
notes = "the z (blocks) of blocks[0]"

[[type.field]]
offset = 0x18
name = "blocks"
type = "cube::Block*"
status = "verified"
evidence = ["manual:getBlock returns +0x18 + 4 * (z - base_z)", "xref:cube::World::getBlock", "probe:world-block-client", "probe:world-block-server"]
source = "kyubu"
notes = "size blocks, from base_z up"

[[type.field]]
offset = 0x1C
name = "size"
type = "int32_t"
status = "verified"
evidence = ["manual:getBlock: z at or above base_z + size is open", "xref:cube::World::getBlock", "probe:world-block-client", "probe:world-block-server"]
source = "kyubu"
notes = "how many blocks the column holds"

[[type]]
name = "cube::Block"
kind = "struct"
size = 0x4
status = "verified"
evidence = ["manual:getBlock tests byte +3 & 0x1F and & 0x40", "xref:cube::World::projectileSurfaceSite"]
source = "kyubu"
notes = "one block: its colour and its kind. Kind (type & 0x1F) 0 is air, 1 solid, 2 water, 3 wet ground, 4 and up ground kinds; bit 0x40 marks a block inside a building (no water below z 1)"

[[type.field]]
offset = 0x0
name = "color"
type = "uint8_t[3]"
status = "verified"
evidence = ["manual:the three bytes before the kind; the static default blocks", "xref:cube::World::getBlock"]
source = "kyubu"
notes = "red, green, blue"

[[type.field]]
offset = 0x3
name = "type"
type = "uint8_t"
status = "verified"
evidence = ["manual:getBlock tests byte +3 & 0x1F and & 0x40", "xref:cube::World::projectileSurfaceSite", "probe:world-block-client", "probe:world-block-server"]
source = "kyubu"
notes = "the kind in bits 0 to 4; bit 5 destructible, bit 6 inside a building, bit 7 under water (Infinite-Cubes names)"

[[type]]
name = "cube::Spawn"
kind = "class"
size = 0x10F0
builds = ["server-0x51D2CE9B", "server-0x51EA94D5"]
status = "candidate"
evidence = ["rtti:cube::Spawn", "manual:operator new(0x10F0) before cube::Spawn::Spawn in the generators"]
source = "kyubu"
notes = "the record world generation builds a creature from. Only the level-related fields are mapped; the offsets match cuwo's Spawn in cuwo/tgen_wrap.pxd"

[[type.field]]
offset = 0x28
name = "hostile_type"
type = "int32_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "xref:dungeon_generate"]
source = "kyubu"
notes = "a cube::HostileType written as 4 bytes: 1 for monsters, 6 for chests, 5 in site_generate"

[[type.field]]
offset = 0x2C
name = "entity_type"
type = "uint32_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "xref:creature_level_range"]
source = "kyubu"
notes = "a cube::EntityType; creature_level_range takes it"

[[type.field]]
offset = 0x34
name = "level"
type = "int32_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "manual:1 from cube::Spawn::Spawn; rolled or copied by the generators"]
source = "kyubu"
notes = "creature_level_range rolls for wild monsters, a mission's area_level (spawn_level_from_mission), the zone level for dungeons (dungeon_generate), or a copy for pack members"

[[type.field]]
offset = 0x58
name = "power_base"
type = "uint8_t"
status = "candidate"
evidence = ["cuwo:cuwo/tgen_wrap.pxd", "xref:dungeon_generate"]
source = "kyubu"
notes = "the \"+N\" shown after the creature's name; from the dungeon (Zone.power_base) or the covering mission (dword28)"

[[type.field]]
offset = 0x74
name = "appearance"
type = "cube::AppearanceData"
status = "candidate"
evidence = ["manual:its flags (+6, spawn+0x7A) get 0x200 on 1% of wild hostiles", "xref:cube::World::generateZone"]
source = "kyubu"
notes = "appearance flags seen: 0x200 (elite, x10 kill XP), 0x1000 (dungeon monster, no elite roll), 0x800 (no kill XP)"

# One particle effect (cuwo's ParticleData, the particle packet of a server update): the same 0x48 bytes the game keeps in a
# std::list in each World step's output. The effect is `count` small cubes started at `pos`, with `accel` as their gravity.

[[type]]
name = "cube::Light"
kind = "struct"
size = 0x30
status = "verified"
evidence = ["xref:light_vector_push", "manual:pushed by the Fire Mage in play, lit models and ground (2026-10-18)"]
source = "kyubu"
notes = "a point light of the frame's light vector (cube::GameController::render): the game builds one for each lamp, projectile, flash and lit world object; the vertex shader takes 10 for the models and the terrain regions 16 each"

[[type.field]]
offset = 0x0
name = "pos"
type = "cube::LongVector3"
status = "verified"
evidence = ["manual:records dumped in play and under Wine, probe light-place", "xref:light_vector_push"]
source = "kyubu"
notes = "world units, 65,536 to a block"

[[type.field]]
offset = 0x18
name = "radius"
type = "float"
status = "verified"
evidence = ["manual:a lamp's is rarity * 8 + 10, dumped in play", "xref:light_vector_push"]
source = "kyubu"
notes = "blocks"

[[type.field]]
offset = 0x1C
name = "color"
type = "float[3]"
status = "verified"
evidence = ["manual:records dumped in play; the strength is in it (lamp 0.45 to 1.05)", "xref:light_vector_push"]
source = "kyubu"
notes = "red, green, blue; above 1 is brighter"

[[type.field]]
offset = 0x28
name = "distance_sq"
type = "float"
status = "verified"
evidence = ["manual:dumped: the squared distance to the camera, in blocks", "xref:light_vector_push"]
source = "kyubu"
notes = "the sort key: the render sorts the vector by it, ascending, before the terrain hand-out; 0 sorts first"

[[type]]
name = "cube::ParticleData"
kind = "struct"
size = 0x48
status = "verified"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::hitCreature"]
source = "cuwo"
notes = "built on the stack by cube::World::hitCreature and by cube::World::update, then pushed with step_output_push_particle"

[[type.field]]
offset = 0x0
name = "pos"
type = "cube::LongVector3"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "xref:cube::World::hitCreature"]
source = "cuwo"
notes = "world units, 65,536 to a block: hitCreature copies the target's position"

[[type.field]]
offset = 0x18
name = "accel"
type = "float[3]"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "manual:hitCreature stores 0, 0, 10"]
source = "cuwo"
notes = "blocks per second squared (a guess from cuwo's name); the hit effect has 10 on z"

[[type.field]]
offset = 0x24
name = "color"
type = "float[4]"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "manual:hitCreature stores 0.6, 0.6, 1, 1"]
source = "cuwo"
notes = "red, green, blue and alpha, 0 to 1"

[[type.field]]
offset = 0x34
name = "scale"
type = "float"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "manual:the sites store 0.1 to 0.5"]
source = "cuwo"
notes = "the size of one particle, in blocks"

[[type.field]]
offset = 0x38
name = "count"
type = "uint32_t"
status = "candidate"
evidence = ["cuwo:cuwo/packet.py", "manual:the sites store 3 to 20"]
source = "cuwo"
