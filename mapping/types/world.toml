# What a World step writes (the step_out argument of cube::World::update): a std::list of each kind of thing that
# happened, which the game controller then plays, and a joined client sends the hits and shots on.

[[type]]
name = "cube::StepOutput"
kind = "struct"
size = 0
status = "verified"
evidence = ["xref:cube::World::update", "xref:cube::World::hitCreature", "manual:the pushes' this pointers in hitCreature and the World step"]
source = "kyubu"
notes = "only the lists the mapping has seen are listed; each is an 8-byte std::list"

[[type.field]]
offset = 0x0
name = "hits"
type = "std::list"
status = "candidate"
evidence = ["manual:hitCreature passes the output itself to the hit push (0x486760)", "xref:cube::World::hitCreature"]
source = "kyubu"
notes = "cube::Hit, 0x50-byte nodes"

[[type.field]]
offset = 0x8
name = "sounds"
type = "std::list"
status = "candidate"
evidence = ["manual:hitCreature passes output + 8 to the sound push (0x5F35B0)", "xref:cube::World::hitCreature"]
source = "kyubu"
notes = "cuwo's sound action: 0x18 bytes, 0x20-byte nodes"

[[type.field]]
offset = 0x10
name = "particles"
type = "std::list"
status = "verified"
evidence = ["manual:output + 0x10 is the push's this", "xref:step_output_push_particle"]
source = "kyubu"
notes = "cube::ParticleData, 0x50-byte nodes"

[[type.field]]
offset = 0x20
name = "shots"
type = "std::list"
status = "candidate"
evidence = ["manual:the projectile spawn copies the shot to output + 0x20 (atlas: combat)"]
source = "kyubu"
notes = "cuwo's shoot packet; a joined client sends them to the server"
