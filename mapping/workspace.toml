# Kyubu mapping workspace: the pinned toolchain, the analysis options and the supported builds.
# kmap reads this file; changing the Ghidra pin is its own change (re-run the survey, review the diff).

subsystems = ["core", "world", "creatures", "combat", "items", "ai", "ui", "rendering", "audio", "input",
              "network", "saves", "travel", "library"]
no_atlas_page = ["library"]   # statically linked third-party code (SQLite, STL, Ogg): no atlas page

[ghidra]
version = "12.1.4"
archive = "ghidra_12.1.4_PUBLIC_20260921.zip"
url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
sha256 = "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
folder = "ghidra_12.1.4_PUBLIC"
max_heap = "4G"     # the cloud workspace has about 7 GB of RAM
jdk = 21            # minimum JDK major version

[analysis]
language = "x86:LE:32:default"
compiler = "windows"

# Ghidra analysis options set before auto-analysis (names as in Analysis > Auto Analyze). kmap init fails
# when a name is unknown to the pinned Ghidra, so a typo cannot silently fall back to the default.
[analysis.options]
"Windows x86 PE RTTI Analyzer" = true
"Decompiler Parameter ID" = true
"Aggressive Instruction Finder" = false

[cuwo]
repository = "https://github.com/matpow2/cuwo"
commit = "240bb61ec42abb10a73d750ce72f243e04e55509"

