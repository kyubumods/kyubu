# kyubu_probe script: runs once the game is ready (Cube.exe: the start menu), in dev mode only.
# One command per line, as in the console without the "kyubu_probe:" prefix (see docs/probes.md), plus:
#   wait <seconds>     wait world     log <text>
# Every line below is a comment, so nothing runs. An example that traces two functions for ten seconds:
#
# trace add cube::GameController::update
# trace add cube::Database::get
# trace start
# wait 10
# trace stop
# trace report
# expect cube::GameController::update calls cube::GameController::update > 0
# expect - hooks == 0
