# A clip with every problem describe reports: no blends, a start off the base pose, a held end, a set track, a jump, a hold ease.
duration = 800
end = "hold"

[[track]]
part = "body"
channel = "rot"
keys = [
  { t = 0.0, v = [0, 20, 0] },
  { t = 0.5, v = [0, 20, 0] },
  { t = 0.5, v = [0, -20, 0] },
  { t = 1.0, v = [0, -20, 0], ease = "linear" },
]

[[track]]
part = "root"
channel = "pos"
mode = "set"
keys = [
  { t = 0.0, v = [0, 0, 0.5] },
  { t = 1.0, v = [0, 0, 2], ease = "hold" },
]

[borrow]
mode = 12
speed = 1.5
offset_ms = 100

[[marker]]
t = 1.0
name = "end \"of\" clip"
